    try { navigator.clipboard.writeText(text).then(() => toast("All saved data copied"), fallback); } catch (e) { fallback(); }
  },
  toast: d => toast(d.msg),
  noop: () => {},
  openclient: d => { S.client = d.ref; S.tab = "overview"; go("client"); },
  openreport: d => { S.client = d.ref; go("report"); },
  openfinding: d => { S.client = d.ref; go("finding"); },
  toggleexamples: () => { S.showExamples = !S.showExamples; render(); },
  newclient: () => openModal("client", {}),
  editclient: () => openModal("client", { edit: true }),
  async saveclient(d, btn) {
    const editing = S.modalCtx && S.modalCtx.edit;
    const errs = {};
    if (!val("m-name")) errs["m-name"] = "Enter the client's name";
    if (!val("m-l1")) errs["m-l1"] = "Enter the first line of the address";
    if (!val("m-town")) errs["m-town"] = "Enter the town or city";
    if (!val("m-pc")) errs["m-pc"] = "Enter the postcode";
    if (val("m-email") && !/^\S+@\S+\.\S+$/.test(val("m-email"))) errs["m-email"] = "Enter an email address like name@example.co.uk";
    if (showErrors(errs, "m-err")) return;
    const base = { name: val("m-name"), propertyName: val("m-pname"), address: { line1: val("m-l1"), line2: val("m-l2"), town: val("m-town"), postcode: val("m-pc").toUpperCase() }, email: val("m-email"), phone: val("m-phone") };
    if (editing) {
      const property = Object.fromEntries(PROPERTY_FIELDS.map(([k]) => [k, val("m-p-" + k)]));
      await updateClient(S.client, { ...base, property });
      closeModal(); toast("Details saved"); return;
    }
    btn.disabled = true; btn.textContent = "Creating…";
    let claim;
    try { claim = await Store.claimRef(); }
    catch (e) { btn.disabled = false; btn.textContent = "Create client"; boxError("m-err", "A reference could not be given just now. Please try again."); return; }
    const mode = (document.querySelector('input[name="m-alloc"]:checked') || {}).value || "all";
    const svc = val("m-svc");
    const tests = mode === "all" ? allocFrom(ALL_POINTS) : mode === "service" ? allocFrom(PACKAGES[svc] || []) : allocFrom([]);
    const client = { ref: claim.ref, num: claim.num, ...base, service: mode === "all" ? "Home Health Analysis" : mode === "service" ? svc : "", tests, rooms: (ROOM_TEMPLATES[val("m-tpl")] || ROOM_TEMPLATES.t1).rooms, roomTemplate: val("m-tpl") || "t1", notes: {}, property: {}, internalNote: "", createdAt: new Date().toISOString(), createdBy: ASSESSOR };
    const ok = await Store.put("clients", claim.ref, client);
    S.modal = null; S.modalCtx = null; S.client = claim.ref; S.tab = mode === "none" ? "tests" : "overview"; S.room = "bed1";
    go("client");
    toast(ok ? `${claim.ref} created for ${base.name}` : `${claim.ref} could not be saved. Please try again.`);
  },
  tab: d => { S.tab = d.tab; render(); },
  tabgo: d => { S.tab = d.tab; go("client"); },
  alloc: d => { const a = { ...alloc(S.client) }; a[d.code] = !a[d.code]; setAlloc(S.client, a); },
  allocall: () => setAlloc(S.client, allocFrom(ALL_POINTS)),
  allocnone: () => setAlloc(S.client, allocFrom([])),
  applysvc: () => {
    const svc = val("svc"), c = C();
    if (c.example) c.service = svc; else updateClient(c.ref, { service: svc });
    setAlloc(S.client, allocFrom(PACKAGES[svc] || [])); toast(`Tests allocated from ${svc}`);
  },
  record: d => openModal("reading", { point: d.point, room: d.room, method: d.meth }),
  async savereading() {
    const c = C(), ctx = S.modalCtx || {};
    const method = val("m-meth"), result = val("m-result"), errs = {};
    let value = null, axes = null;
    if (method === "three-axis") {
      const xyz = ["m-x", "m-y", "m-z"].map(id => parseFloat(val(id).replace(",", ".")));
      if (xyz.some(isNaN)) { if (result !== "observation") ["m-x", "m-y", "m-z"].forEach((id, i) => { if (isNaN(xyz[i])) errs[id] = "Enter a number"; }); }
      else { axes = xyz; value = Math.round(resultant(xyz) * 10) / 10; }
    } else if (val("m-val")) {
      value = parseFloat(val("m-val").replace(",", "."));
      if (isNaN(value)) errs["m-val"] = "Enter a number, for example 2.1";
    } else if (result !== "observation") errs["m-val"] = "Enter a value, or choose Professional observation and add a note";
    if (result === "observation" && value == null && !val("m-note")) errs["m-note"] = "Add a note describing the observation";
    if (showErrors(errs, "m-err")) return;
    const point = val("m-pt"), unit = val("m-unit"), phase = val("m-phase");
    const id = `${c.ref}-R${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;
    const reading = {
      id, client: c.ref, room: val("m-room"), point, label: val("m-label") || POINT_NAME[point], value, axes,
      unit: value != null ? unit : "", ref: value != null && result !== "screening" ? refFor(point, unit, method) : null,
      method, methodLabel: METHODS.find(m => m[0] === method)[1] + (val("m-mdet") ? ", " + val("m-mdet") : ""),
      inst: val("m-inst") || null, timing: val("m-timing"), result, when: nowStamp(), dur: val("m-dur"), loc: val("m-loc"),
      cond: { occupancy: val("m-occ"), windows: val("m-win"), heating: val("m-heat"), appliances: val("m-app") },
      by: ASSESSOR, phase: phase === "single" ? null : phase, grid: ctx.grid || null, note: val("m-note"), createdAt: new Date().toISOString(),
      roomType: roomTypeOf(c.ref, val("m-room")), test: ctx.test || null
    };
    const ok = await Store.put("readings", id, reading);
    if (ok) await allocateIfNeeded(c.ref, point);
    closeModal(); markEdited();
    toast(ok ? `Reading saved to ${c.ref} · ${point}` : "The reading could not be saved. Please try again.");
  },
  newsample: d => openModal("sample", { room: d.room }),
  async savesample() {
    const c = C(), type = val("s-type"), [label, point] = SAMPLE_TYPES[type];
    const taken = new Set(samplesFor(c.ref).map(s => s.ref));
    let n = 1, ref; do { ref = `${c.ref}-${type}${String(n).padStart(2, "0")}`; n++; } while (taken.has(ref));
    const loc = val("s-loc"), status = val("s-status"), st = SAMPLE_STATUS.find(x => x[0] === status)[1];
    const water = type === "W" ? { supply: val("s-supply"), filtered: val("s-filt") === "Filtered", draw: val("s-draw") } : null;
    const what = water ? `Water, ${loc || "outlet not recorded"}, ${val("s-supply").toLowerCase()}, ${val("s-filt").toLowerCase()}, ${val("s-draw").toLowerCase()}` : `${label}${loc ? ", " + loc : ""}`;
    const sample = { ref, client: c.ref, room: val("s-room"), point, type, what, method: val("s-meth") || label, lab: val("s-lab") || "Not recorded", date: nowStamp(), status, st, water, by: ASSESSOR, createdAt: new Date().toISOString() };
    const ok = await Store.put("samples", ref, sample);
    if (ok) await allocateIfNeeded(c.ref, point);
    closeModal(); toast(ok ? `Sample ${ref} saved` : "The sample could not be saved. Please try again.");
  },
  capture: () => { const rooms = siteRooms(S.client); if (!rooms.some(r => r.id === S.room)) S.room = rooms[0].id; go("room"); },
  roomtest: d => { S.room = d.room; S.mt.reviewing = false; S.mt.flash = null; go(d.sec); },
  openroom: d => { S.room = d.room; go("room"); },
  addroom: () => {
    const name = val("nr-name"); if (!name) { toast("Enter a room name first"); document.getElementById("nr-name")?.focus(); return; }
    const type = val("nr-type"); addRoomTo(S.client, { id: `${type}-${Date.now().toString(36)}`, name, type, floor: val("nr-floor") });
    toast(`${name} added`);
  },
  room: d => { S.room = d.room; render(); },
  duplicate: () => {
    const r = currentRoom();
    if (isFixture(S.client)) { toast(`Structure of ${r.name} copied: tests, prompts and measurement positions, without readings`); return; }
    addRoomTo(S.client, { id: `${r.type}-${Date.now().toString(36)}`, name: `${r.name} (copy)`, type: r.type, floor: r.floor || "" });
    toast(`${r.name} duplicated without readings`);
  },
  online: () => { S.online = !S.online; if (S.online && S.pending) { const n = S.pending; S.pending = 0; S.savedAt = nowHM(); render(); toast(`${n} change${n === 1 ? "" : "s"} synced`); } else render(); },
  mic: () => {
    S.mic = !S.mic; const roomId = currentRoom().id; render();
    if (!S.mic) { const t = document.querySelector(`textarea[data-note="${roomId}"]`); if (t) { t.value += (t.value ? " " : "") + "Dictated: musty smell faint near wardrobe, client confirms only in winter."; saveNote(S.client, roomId, t.value); } }
  },
  modal: d => openModal(d.modal, {}),
  close: () => closeModal(),
  backdrop: (d, el, e) => { if (e.target === el) closeModal(); },
  async importcsv() {
    const c = C(), room = currentRoom();
    if (isFixture(c.ref)) { closeModal(); markEdited(); toast("Overnight data imported: 10 points, maximum 1,450 ppm at 05:00"); return; }
    const text = (S.csv && S.csv.text) || SAMPLE_CSV, rows = text.trim().split(/\r?\n/).slice(1).map(l => l.split(","));
    const vals = rows.map(r => parseFloat(r[1])).filter(v => !isNaN(v));
    if (!vals.length) { toast("No readings found in that file"); return; }
    const max = Math.max(...vals), id = `${c.ref}-R${Date.now().toString(36)}`;
    const ok = await Store.put("readings", id, { id, client: c.ref, room: room.id, point: "B6", label: "CO₂ overnight maximum, imported from CSV", value: max, axes: null, unit: "ppm", ref: "sbm-co2", method: "any", methodLabel: `Logger CSV import, ${vals.length} points`, inst: "aranet4", timing: "overnight", result: "reading", when: nowStamp(), dur: `${vals.length} readings`, loc: (S.csv && S.csv.name) || "Aranet4 export", cond: {}, by: ASSESSOR, phase: null, grid: null, note: "", createdAt: new Date().toISOString() });
    closeModal(); toast(ok ? `Imported to ${c.ref}: ${vals.length} points, maximum ${fmt(max)} ppm` : "The import could not be saved.");
  },
  finding: d => { S.findingId = d.id; S.priority = null; S.explanationOpen = false; render(); },
  conflict: d => { S.conflict = false; if (d.keep === "theirs") FINDINGS[0].cost = "Free to £400"; markEdited(); render(); toast(d.keep === "theirs" ? "Alfie's cost range applied. Both versions kept in history." : "Your version kept. Alfie has been notified."); },
  explain: () => { S.explanationOpen = !S.explanationOpen; render(); },
  useexplain: d => { const f = findingById(S.findingId); f.why = EXPLANATIONS.find(x => x.id === d.id).text; S.explanationOpen = false; markEdited(); render(); },
  prio: d => { S.priority = d.p; findingById(S.findingId).priority = d.p; markEdited(); render(); },
  approve: () => { const f = findingById(S.findingId); f.status = "approved"; f.edited = "Just now"; markEdited(); render(); toast("Finding approved"); },
  check: d => { S.checks[d.k] = !S.checks[d.k]; render(); },
  publish: () => { S.versions.push({ v: "v1.1", label: "Full report", date: "23 Oct 2026", by: "Iza", note: "Published to portal. Reference set SBM-2024 / UK 2026.1 frozen with this version." }); render(); toast("Report v1.1 published. Harriet and Tom have been notified."); },
  qnext: () => { S.qStep = Math.min(7, S.qStep + 1); render(); },
  qprev: () => { S.qStep = Math.max(0, S.qStep - 1); render(); },
  qgo: d => { S.qStep = +d.step; render(); },
  qroom: d => { S.qRooms[d.v] = !S.qRooms[d.v]; render(); },
  qconcern: d => { S.qConcerns[d.v] = !S.qConcerns[d.v]; render(); },
  qconsent: () => { S.qConsent = !S.qConsent; render(); },
  qsend: () => { S.qSent = true; render(); },
  qreset: () => { S.qSent = false; S.qStep = 7; render(); },
  eq: d => { S.eq = d.id; render(); },
  ptab: d => { S.portalTab = d.t; render(); },
  done: d => { S.done[d.id] = !S.done[d.id]; render(); if (S.done[d.id]) toast("Marked as done. Iza and Alfie can see your progress."); }
};
/* Assessment sheet entry: save as typed, flag non-numbers, keep the mattress picture current */
function sheetInput(t) {
  const sec = sectionById(S.screen); if (!sec) return;
  const room = sheetRoomKey(sec); if (!room) return;
  const value = t.type === "checkbox" ? t.checked : t.value;
  if (t.matches("[data-num]")) { if (value !== "" && parseNum(value) == null) t.setAttribute("aria-invalid", "true"); else t.removeAttribute("aria-invalid"); }
  setSheet(S.client, room, sec.id, t.dataset.sheet, value);
}
/* Bedroom details live on the client profile: who sleeps there, the bed and the mattress size */
function setBedroom(ref, id, field, value, wait) {
  const c = getClient(ref); markEdited();
  if (c.example) { S.exBedrooms[ref] = S.exBedrooms[ref] || {}; S.exBedrooms[ref][id] = { ...(S.exBedrooms[ref][id] || {}), [field]: value }; return; }
  const base = { ...(c.bedrooms || {}), ...(S.bedDraft[ref] || {}) };
  S.bedDraft[ref] = { ...base, [id]: { ...(base[id] || {}), [field]: value } };
  debounce("beds:" + ref, async () => { const next = S.bedDraft[ref]; await updateClient(ref, { bedrooms: next }); if (S.bedDraft[ref] === next) delete S.bedDraft[ref]; }, wait);
}
function saveNote(ref, roomId, text) {
  const c = getClient(ref); markEdited();
  if (c.example) { S.notes[ref + ":" + roomId] = text; return; }
  debounce("note:" + ref + roomId, () => updateClient(ref, { notes: { ...(getClient(ref).notes || {}), [roomId]: text } }));
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  if (el.tagName === "A") e.preventDefault();
  const fn = ACT[el.dataset.action];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("g[data-action], tr[data-action], div[data-action][tabindex]")) { e.preventDefault(); ACT[e.target.dataset.action](e.target.dataset, e.target, e); }
  if (S.modal === "pad") {
    if (/^\d$/.test(e.key)) { e.preventDefault(); padKey(e.key); return; }
    if (e.key === "." || e.key === ",") { e.preventDefault(); padKey("."); return; }
    if (e.key === "Backspace") { e.preventDefault(); padKey("del"); return; }
    if (e.key === "Enter" && !e.target.matches("button")) { e.preventDefault(); if (padValid()) mtConfirm(S.mt.pad.nm); return; }
  }
  if (e.key === "Escape" && S.modal) closeModal();
  else if (e.key === "Escape") closeNav(true);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.getAttribute("aria-invalid") === "true") { t.removeAttribute("aria-invalid"); const er = document.getElementById(t.id + "-err"); if (er) er.hidden = true; }
  if (t.matches("[data-input]")) markEdited();
  if (t.matches("[data-search-input]")) { S.search = t.value; applySearch(); }
  if (t.matches("[data-sheet]")) sheetInput(t);
  if (t.matches("input[data-bedroom]")) { const [ref, id, f] = t.dataset.bedroom.split("|"); setBedroom(ref, id, f, t.value, 800); }
  if (t.matches("[data-note]")) saveNote(S.client, t.dataset.note, t.value);
  if (t.matches("[data-intnote]")) {
    const ref = t.dataset.intnote, c = getClient(ref); markEdited();
    if (c.example) S.notes["int-" + ref] = t.value; else debounce("int:" + ref, () => updateClient(ref, { internalNote: t.value }));
  }
  if (t.matches("[data-dupcheck]")) {
    const name = t.value.trim().toLowerCase(), editing = S.modalCtx && S.modalCtx.edit;
    const same = name ? allClients().filter(c => c.name.toLowerCase() === name && !(editing && c.ref === S.client)) : [];
    document.getElementById("m-dup").innerHTML = same.length ? `<div class="notice notice-info">${icon("info")}<span class="small">${same.map(c => `${c.ref} · ${esc(c.name)} · ${esc(addrLine(c))}`).join("<br>")}<br>A client with this name already exists. If this is a second home, add a property name so the two records are easy to tell apart.</span></div>` : "";
  }
});
document.addEventListener("change", e => {
  const t = e.target, kind = t.dataset.change;
  if (t.matches("select[data-sheet], input[type=checkbox][data-sheet]")) sheetInput(t);
  if (kind === "pickclient") { S.client = t.value; const rooms = siteRooms(S.client); if (!rooms.some(r => r.id === S.room)) S.room = (rooms[0] || {}).id; render(); document.getElementById("cb-client")?.focus(); toast(`Results will be saved to ${S.client}`); }
  if (kind === "picksize") { setBedroom(S.client, mtRoom(), "size", t.value, 0); render(); document.getElementById("cb-size")?.focus(); toast(t.value ? `Mattress size saved for ${bedName(mtRoom())}` : "Mattress size cleared"); }
  if (t.matches("select[data-bedroom]")) { const [ref, id, f] = t.dataset.bedroom.split("|"); setBedroom(ref, id, f, t.value, 0); }
  if (kind === "pickbed") { S.room = t.value; S.mt.flash = null; S.mt.reviewing = false; S.mt.confirmNew = false; S.mt.viewRun = null; render(); document.getElementById("cb-bed")?.focus(); }
  if (kind === "pickroom") { S.room = t.value; S.cell = 0; render(); document.getElementById("cb-room")?.focus(); }
  if (t.id === "m-meth") { const axes = t.value === "three-axis"; document.getElementById("m-axes").hidden = !axes; document.getElementById("m-valwrap").hidden = axes; }
  if (t.id === "m-inst") { const eq = inst(t.value); if (eq) document.getElementById("m-result").value = eq.result; }
  if (t.id === "s-type") {
    document.getElementById("s-water").hidden = t.value !== "W";
    document.getElementById("s-lab").value = t.value === "W" ? "On-site screening" : t.value === "R" ? "Analysis on return" : "External specialist laboratory";
  }
  if (kind === "qfile" && t.files.length) { S.qFiles.push(...[...t.files].map(f => f.name)); render(); }
  if (kind === "roomphoto" && t.files.length) { markEdited(); toast(`Photograph attached to ${currentRoom().name}${S.online ? "" : ", queued for upload"}`); }
  if (kind === "progress" && t.files[0]) { const id = t.dataset.id; const rd = new FileReader(); rd.onload = () => { S.photos[id] = rd.result; render(); toast("Progress photo shared with Iza and Alfie"); }; rd.readAsDataURL(t.files[0]); }
  if (kind === "csv" && t.files[0]) { const f = t.files[0]; const rd = new FileReader(); rd.onload = () => { const text = String(rd.result).slice(0, 200000); S.csv = { text, name: f.name }; document.getElementById("csv-preview").innerHTML = csvPreview(text, f.name); }; rd.readAsText(f); }
});
document.addEventListener("submit", e => {
  if (e.target.matches("[data-form='ask']")) {
    e.preventDefault();
    const t = document.getElementById("ask-text");
    if (!t.value.trim()) { toast("Please write your question first"); return; }
    S.messages.push({ me: true, text: t.value.trim(), when: "Just now" }); render(); toast("Question sent. We usually reply within one working day.");
  }
});

(function start() {
  document.getElementById("brand").innerHTML = logoInner("Assessment Studio");
  const h = (location.hash || "").replace("#", "");
  const k = LEGACY[h] || h;
  if (RENDER[k]) S.screen = k;
  render();
  window.addEventListener("hashchange", () => { const n = location.hash.replace("#", ""); const m = LEGACY[n] || n; if (RENDER[m] && m !== S.screen) go(m); });
  Store.init();
})();
</script>
