<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emerald Grey Assessment Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap">
<style>
/* Layout concept: a prototype bar above a device stage; each screen renders inside a
   device frame (desktop, tablet, phone) that uses container queries, so the phone and
   tablet layouts are faithful even when viewed on a large monitor. */
/* Emerald Grey Brand Guidelines v3 (November 2026). Light grounds carry the work; forest is
   the deliberate contrast. One light theme by design. Gold is a single accent: hairlines,
   frames and italic emphasis on forest only, because gold on cream is too low in contrast
   for text (2.1:1). Sage and neutral are deepened slightly for small text to reach 4.5:1. */
:root {
  color-scheme: light;
  --forest: #22372B;       /* Forest Green: headlines, primary actions, contrast moments */
  --deep-forest: #2D3D35;  /* Deep Forest: body text */
  --cream: #F8F6F2;        /* Cream: default ground for sheets and cards */
  --linen: #F1ECE6;        /* Linen: app canvas */
  --blush: #F7F0E8;        /* Blush: cover panels and soft highlights */
  --ghost: #EEEBE5;        /* Ghost Stone: oversized numerals and faint panels */
  --stone: #D6D1C4;        /* Warm Stone: hairline rules, pale fills */
  --mid-sage: #6E7C5B;     /* Mid Sage: icons and larger labels */
  --soft-sage: #A9B6A4;    /* Soft Sage: dividers, subtle blocks */
  --gold: #C2A979;         /* Warm Gold: hairlines, frames, emphasis on forest */
  --fern: #35684F;         /* Fern Green: notes, labels and key data */
  --sage-text: #5E6B4C;    /* Mid Sage deepened for small text (5.3:1 on cream) */
  --gold-text: #7C6337;    /* Warm Gold deepened for text on light grounds */

  /* Interface roles, mapped to the brand palette */
  --paper: var(--linen);
  --surface: var(--cream);
  --sunk: var(--ghost);
  --line: var(--stone);
  --ink: var(--deep-forest);
  --ink-2: #4A5650;
  --ink-3: #615D53;        /* captions and metadata, Warm Neutral deepened for legibility */
  --emerald: var(--forest);
  --emerald-2: var(--fern);
  --emerald-tint: #E3E8DF; /* Soft Sage tint */
  --on-emerald: var(--cream);
  --brass: var(--gold);
  --brass-tint: #F3ECDF;
  /* Status colours drawn from the landscape palette, always paired with a text label */
  --ok: var(--fern);  --ok-bg: #E3EBE3;
  --slight: #6F5A22;  --slight-bg: #F1E8D2;
  --strong: #8A4E33;  --strong-bg: #F1E0D6;
  --extreme: #7E2F27; --extreme-bg: #EED6D0;
  --info: #44595A;    --info-bg: #E2E7E4;
  --muted: #5D5A52;   --muted-bg: #ECE8E1;
  --shadow: none;          /* the brand reads flat, matte and tactile */
  /* Heatmap colours from Emerald Grey's evaluation chart: no, slight, severe and extreme anomaly */
  --heat-no: #3E9A56; --heat-slight: #A9AD34; --heat-severe: #E48A35; --heat-extreme: #D2453D;
  --font-display: "Playfair Display", "Iowan Old Style", Georgia, serif;
  --font-accent: "Cormorant Garamond", "Garamond", Georgia, serif;
  --font-body: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-data: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r-s: 3px; --r-m: 4px; --r-l: 6px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--cream); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; letter-spacing: 0; text-wrap: balance; margin: 0; color: var(--forest); }
b, strong { font-weight: 500; }
em.gold { font-style: italic; color: var(--gold); }
h1 { font-size: 1.95rem; line-height: 1.15; }
h2 { font-size: 1.4rem; line-height: 1.2; }
h3 { font-size: 1.12rem; line-height: 1.25; }
h4 { font-family: var(--font-body); font-size: .72rem; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--sage-text); }
p { margin: 0; }
a { color: var(--sage-text); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--emerald-2); outline-offset: 2px; border-radius: 4px; }
.num, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: .84rem; }
.xsmall { font-size: .76rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-l { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- App shell ----------
   Desktop: a forest menu down the left, framed by a gold hairline.
   Tablet and phone: the same menu slides in from the menu button. */
.wordmark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.wordmark b { font-family: var(--font-accent); font-weight: 500; font-size: 1.08rem; letter-spacing: .24em; text-transform: uppercase; white-space: nowrap; color: var(--forest); display: block; line-height: 1.2; }
.wordmark span { font-size: .62rem; text-transform: uppercase; letter-spacing: .16em; color: var(--sage-text); display: block; line-height: 1.4; }
.app-frame { container: app / inline-size; min-height: 100vh; position: relative; }
.app-frame[data-frame] { margin: 16px auto; border: 10px solid var(--deep-forest); border-radius: 22px; overflow: hidden; min-height: calc(100vh - 32px); transform: translateZ(0); }
.app-frame[data-frame="tablet"] { max-width: 900px; }
.app-frame[data-frame="phone"] { max-width: 400px; border-radius: 30px; }
@media (max-width: 520px) { .app-frame[data-frame] { margin: 0; border-width: 0; border-radius: 0; } }
.app { display: grid; grid-template-columns: minmax(0, 1fr); min-height: inherit; }
.app-main { min-width: 0; display: flex; flex-direction: column; }
#screen { container-type: inline-size; min-width: 0; flex: 1; }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; background: var(--cream); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.appbar .wordmark { margin-right: auto; min-width: 0; }
.hamburger, .nav-close { width: 42px; height: 42px; display: grid; place-items: center; border-radius: var(--r-m); cursor: pointer; flex: none; }
.hamburger { border: 1px solid var(--line); background: var(--surface); color: var(--forest); }
.hamburger .icon, .nav-close .icon { width: 20px; height: 20px; }
.appbar-client { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; cursor: pointer; font-size: .82rem; color: var(--ink-2); min-width: 0; }
.appbar-client .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28vw; }
.nav { position: fixed; z-index: 40; top: 0; left: 0; bottom: 0; width: min(300px, 86%); transform: translateX(-102%); transition: transform .22s ease; background: var(--forest); color: var(--cream); border-right: 1px solid var(--gold); overflow-y: auto; display: flex; flex-direction: column; gap: 1px; padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); visibility: hidden; }
.app.nav-open .nav { transform: none; visibility: visible; }
.nav-backdrop { display: none; position: fixed; inset: 0; z-index: 35; background: rgba(15, 22, 19, .45); border: 0; padding: 0; }
.app.nav-open .nav-backdrop { display: block; }
.app-frame[data-frame] .nav, .app-frame[data-frame] .nav-backdrop { position: absolute; }
.nav-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 6px 14px 10px; border-bottom: 1px solid rgba(194, 169, 121, .35); margin-bottom: 4px; }
.nav .wordmark b { color: var(--cream); }
.nav .wordmark span { color: var(--gold); }
.nav-close { border: 1px solid rgba(248, 246, 242, .25); background: none; color: var(--cream); }
.nav-section { font-family: var(--font-body); font-size: .66rem; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); padding: 16px 12px 6px; margin: 0; }
.nav-link { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 8px 12px; border-left: 2px solid transparent; border-radius: 0 var(--r-m) var(--r-m) 0; color: rgba(248, 246, 242, .88); font-size: .88rem; line-height: 1.35; text-decoration: none; }
.nav-link:hover { background: rgba(248, 246, 242, .07); color: var(--cream); }
.nav-link[aria-current="page"] { background: rgba(248, 246, 242, .12); color: var(--cream); border-left-color: var(--gold); }
.nav-link .icon { margin-top: 2px; opacity: .85; }
.nav-link small { display: block; font-size: .72rem; color: rgba(248, 246, 242, .7); margin-top: 1px; }
.nav :focus-visible { outline-color: var(--gold); }
.nav-foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid rgba(194, 169, 121, .35); display: flex; flex-direction: column; gap: 12px; color: rgba(248, 246, 242, .88); }
.nav-foot .sync { color: rgba(248, 246, 242, .88); }
.nav-foot .seg { background: rgba(248, 246, 242, .1); }
.nav-foot .seg button { color: rgba(248, 246, 242, .88); }
.nav-foot .seg button[aria-pressed="true"] { background: var(--cream); color: var(--forest); border-color: transparent; }
@container app (min-width: 1200px) {
  .app { grid-template-columns: 280px minmax(0, 1fr); }
  .nav, .app-frame[data-frame] .nav { position: sticky; top: 0; height: 100vh; width: auto; transform: none; transition: none; visibility: visible; z-index: 1; }
  .appbar, .nav-backdrop, .nav-close { display: none !important; }
}
@media (prefers-reduced-motion: reduce) { .nav { transition: none; } }

/* Assessment sheets */
.nav-part { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 0; background: none; cursor: pointer; text-align: left; font-family: var(--font-body); font-size: .66rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); padding: 14px 12px 6px; line-height: 1.4; }
.nav-part .icon { width: 14px; height: 14px; transition: transform .15s; flex: none; }
.nav-part[aria-expanded="false"] .icon { transform: rotate(-90deg); }
.nav-link.sub { padding-left: 16px; font-size: .86rem; }
.sheet { border: 1px solid var(--line); margin: 0; min-width: 0; }
.sheet .span-all { grid-column: 1 / -1; }
.sheet .unit { text-transform: none; letter-spacing: 0; font-weight: 400; }
.sheet td.center { text-align: center; vertical-align: middle; }
.sheet input[type="checkbox"], .checks input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--forest); }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; }
.tickrow { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--cream); cursor: pointer; font-size: .9rem; line-height: 1.4; }
.tickrow input { margin-top: 1px; flex: none; }
.tickrow span { min-width: 0; }
.sheet-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@container (max-width: 640px) { .checks { grid-template-columns: minmax(0, 1fr); } }

/* Nine-point mattress test */
.mt-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mt-ds { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-m); padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 64px; }
.mt-ds b { font-weight: 500; color: var(--forest); }
.mt-ds span { font-size: .78rem; color: var(--ink-3); }
.mt-ds[aria-selected="true"] { border-color: var(--forest); box-shadow: inset 0 -3px 0 var(--forest); background: var(--cream); }
.mt-guided { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }
.mt-map .cell { min-height: 84px; cursor: pointer; font: inherit; border: 2px solid transparent; }
.mt-map .cell.is-current { border-color: var(--forest); outline: 3px solid var(--gold); outline-offset: 1px; }
.mt-pos.st-complete { background: var(--ok-bg); } .mt-pos.st-complete .lab { color: var(--ok); }
.mt-pos.st-progress { background: var(--slight-bg); } .mt-pos.st-progress .lab { color: var(--slight); }
.mt-pos.st-nm { background: var(--muted-bg); } .mt-pos.st-nm .lab { color: var(--muted); }
.mt-pos.st-notstarted { background: var(--surface); } .mt-pos.st-notstarted .lab { color: var(--ink-3); }
.mt-panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.mt-entry { display: flex; flex-direction: column; gap: 12px; }
.mt-progress { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .9rem; }
.mt-label { font-family: var(--font-display); font-size: 1.45rem; color: var(--forest); }
.mt-label b { font-weight: 400; font-style: italic; }
.mt-field-row { display: flex; align-items: center; gap: 12px; }
.mt-field { flex: 1; min-width: 0; min-height: 104px; border: 2px solid var(--forest); border-radius: var(--r-l); background: var(--cream); font-family: var(--font-body); font-size: 3rem; font-variant-numeric: tabular-nums; color: var(--ink); cursor: pointer; text-align: center; }
.mt-field span { font-size: 1.15rem; color: var(--ink-3); }
.mt-field:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.mt-unit { font-size: 1.4rem; color: var(--ink-2); min-width: 3ch; }
.mt-axes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.mt-axis { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; cursor: pointer; font: inherit; min-height: 60px; }
.mt-axis span { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.mt-axis b { font-weight: 500; font-variant-numeric: tabular-nums; }
.mt-axis.is-current { border: 2px solid var(--forest); }
.mt-axis.is-calc { background: var(--emerald-tint); cursor: default; }
.mt-flash, .mt-complete { border: 1px solid var(--gold); background: var(--blush); border-radius: var(--r-l); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.mt-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.mt-actions .btn-primary { margin-left: auto; }
.btn-lg { min-height: 52px; padding: 12px 22px; font-size: 1rem; }
.mt-cell { width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); font: inherit; font-variant-numeric: tabular-nums; text-align: right; padding: 6px 10px; cursor: pointer; }
.mt-cell.is-current { border: 2px solid var(--forest); }
.mt-table td { vertical-align: middle; }
.mt-table td.resultant { background: var(--sunk); }
.pad { max-width: 520px; display: flex; flex-direction: column; gap: 12px; }
.pad-display { display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 92px; border: 2px solid var(--forest); border-radius: var(--r-l); background: var(--cream); font-size: 2.8rem; font-variant-numeric: tabular-nums; }
.pad-msg { min-height: 1.2em; color: var(--ink-3); text-align: center; margin: 0; }
.pad-keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pad-key { min-height: 64px; font-size: 1.6rem; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); color: var(--ink); cursor: pointer; font-family: var(--font-body); }
.pad-key:active { background: var(--emerald-tint); }
.pad-key[data-key="del"] { font-size: 1rem; }
.pad-foot { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.pad-secondary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; flex: 1 1 220px; }
.pad-secondary .btn { min-height: 46px; }
.pad-secondary [aria-pressed="true"] { background: var(--muted-bg); border-color: var(--ink-3); }
.pad-confirm { flex: 1 1 200px; min-height: 98px; font-size: 1.1rem; }
@container (max-width: 820px) { .mt-guided { grid-template-columns: minmax(0, 1fr); } }
@container (max-width: 560px) { .mt-tabs { grid-template-columns: minmax(0, 1fr); } .mt-axes { grid-template-columns: repeat(2, minmax(0, 1fr)); } .mt-field { font-size: 2.4rem; } }

.client-bar.mt-bar { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); }
@container (max-width: 760px) { .client-bar.mt-bar { grid-template-columns: minmax(0, 1fr); } }

.heat-wrap { display: flex; justify-content: center; }
.heat-frame { max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
.heat-head { height: 12px; border-radius: 4px; background: var(--stone); font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); text-align: center; line-height: 12px; margin: 0 -6px; }
.heat-bed { position: relative; width: 100%; border: 1.5px solid var(--ink-3); border-radius: 14px; background: var(--cream); overflow: hidden; isolation: isolate; }
.heat-blobs { position: absolute; inset: 0; filter: blur(10px); opacity: .9; }
.heat-blobs i { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; }
.heat-pillows { position: absolute; left: 6%; right: 6%; top: 2.5%; display: flex; gap: 8%; justify-content: center; }
.heat-pillows i { flex: 1; max-width: 44%; height: 18px; border-radius: 8px; background: var(--surface); opacity: .6; border: 1px solid var(--line); }
.heat-pt { position: absolute; transform: translate(-50%, -50%); width: min(30%, 84px); min-height: 46px; border: 1px solid rgba(45, 61, 53, .3); border-radius: 8px; background: rgba(248, 246, 242, .93); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px 2px; font: inherit; line-height: 1.1; }
.heat-pt b { font-weight: 500; font-size: .95rem; font-variant-numeric: tabular-nums; }
.heat-pt span { font-size: .66rem; color: var(--ink-2); }
.heat-pt.is-empty { border-style: dashed; background: rgba(248, 246, 242, .75); }
.heat-pt .heat-st { color: var(--ink-3); text-align: center; }
.heat-pt.is-current { outline: 2px solid var(--forest); outline-offset: 2px; }
.heat-pt:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.heat-dims { text-align: center; font-size: .72rem; color: var(--ink-3); }
.btn-link { border: 0; background: none; padding: 0; color: var(--sage-text); text-decoration: underline; cursor: pointer; font: inherit; }
.heat-legend { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.heat-legend li { display: flex; gap: 8px; align-items: center; font-size: .8rem; }
.heat-legend i { width: 18px; height: 18px; border-radius: 4px; flex: none; }
@container (max-width: 640px) { .heat-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* On-site capture: every assessment for the chosen room, two columns */
.room-tests { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.room-test { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); color: var(--ink); text-decoration: none; }
a.room-test:hover { border-color: var(--fern); background: var(--cream); }
.room-test.is-na { opacity: .6; }
.rt-name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rt-name b { font-weight: 500; font-size: .9rem; }
@container (max-width: 560px) { .room-tests { grid-template-columns: minmax(0, 1fr); } }

/* Client and room chooser */
.client-bar { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; }
.client-bar-meta { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
table.entry td { padding: 6px; min-width: 96px; }
table.entry td.rowlabel { min-width: 170px; }
table.entry .input { min-height: 36px; padding: 6px 8px; }
.check-row { display: grid; grid-template-columns: minmax(0, 1fr) 220px minmax(0, 1.2fr); gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
@container (max-width: 640px) { .client-bar { grid-template-columns: minmax(0, 1fr); } .check-row { grid-template-columns: minmax(0, 1fr); } }

/* Phone frame for the client-experience previews */
.device { container-type: inline-size; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.device[data-device="phone"] { max-width: 400px; border-radius: 34px; border-width: 9px; border-color: var(--ink); }
@media (max-width: 520px) { .device[data-device] { border-width: 1px; border-color: var(--line); border-radius: 14px; } }

/* ---------- Shared components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px; min-width: 0; }
.card-tight { padding: 14px; }
.card h3 + p { margin-top: 4px; }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 16px; border-radius: var(--r-s); cursor: pointer; font-size: .88rem; font-weight: 500; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--emerald); border-color: var(--emerald); color: var(--on-emerald); }
.btn-primary:hover { background: var(--emerald-2); border-color: var(--emerald-2); }
.btn-quiet { border-color: transparent; background: none; color: var(--emerald); padding-inline: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-s { padding: 5px 11px; font-size: .8rem; }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: .76rem; font-weight: 500; line-height: 1.6; white-space: nowrap; }
.chip .glyph { font-family: var(--font-data); font-size: .72rem; }
.c-ok { background: var(--ok-bg); color: var(--ok); }
.c-slight { background: var(--slight-bg); color: var(--slight); }
.c-strong { background: var(--strong-bg); color: var(--strong); }
.c-extreme { background: var(--extreme-bg); color: var(--extreme); }
.c-info { background: var(--info-bg); color: var(--info); }
.c-muted { background: var(--muted-bg); color: var(--muted); }
.c-emerald { background: var(--emerald-tint); color: var(--emerald); }
.c-brass { background: var(--brass-tint); color: var(--gold-text); }
.c-outline { border: 1px dashed var(--ink-3); color: var(--ink-2); background: none; }
.tag { display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 500; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .field .label { font-size: .8rem; font-weight: 500; color: var(--ink-2); }
.field .hint { font-size: .76rem; color: var(--ink-3); }
.input, select.input, textarea.input {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: 9px 11px; min-height: 40px;
}
textarea.input { min-height: 84px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--emerald-2); outline: none; box-shadow: 0 0 0 3px var(--emerald-tint); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@container (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }

.seg { display: inline-flex; background: var(--sunk); border-radius: var(--r-m); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: var(--r-s); padding: 5px 12px; font-size: .82rem; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 500; border: 1px solid var(--line); }
.pill-check { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: var(--r-m); padding: 7px 13px; cursor: pointer; font-size: .86rem; background: var(--surface); }
.pill-check[aria-pressed="true"] { border-color: var(--emerald-2); background: var(--emerald-tint); color: var(--emerald); font-weight: 500; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 500; background: var(--sunk); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }

.notice { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: var(--r-m); font-size: .86rem; }
.notice-info { background: var(--info-bg); color: var(--ink); }
.notice-warn { background: var(--slight-bg); color: var(--ink); }
.notice-calm { background: var(--emerald-tint); color: var(--ink); }
.notice-muted { background: var(--sunk); color: var(--ink-2); }
.notice .icon { margin-top: 2px; }

.sync { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--ink-2); white-space: nowrap; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); flex: none; }
.sync[data-state="offline"] .sync-dot { background: var(--slight); box-shadow: 0 0 0 3px var(--slight-bg); }
.sync[data-state="saving"] .sync-dot { background: var(--info); box-shadow: 0 0 0 3px var(--info-bg); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .74rem; font-weight: 500; flex: none; }
.av-iza { background: var(--emerald-tint); color: var(--emerald); }
.av-alfie { background: var(--brass-tint); color: var(--gold-text); }
.av-client { background: var(--info-bg); color: var(--info); }

.photo {
  aspect-ratio: 4/3; max-width: 100%; border-radius: var(--r-m); position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--sunk), var(--line));
  display: flex; align-items: flex-end; padding: 8px; font-size: .74rem; color: var(--ink-2);
}
.photo.thermal { background: linear-gradient(120deg, #2b2a6b 0%, #7a2a7e 35%, #d4573a 65%, #f2c14e 100%); color: #fff; }
.photo.wall { background: linear-gradient(160deg, var(--sunk) 0%, var(--line) 60%, var(--brass-tint) 100%); }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo span { position: relative; background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--ink); padding: 2px 7px; border-radius: 4px; }
.photo.thermal span { background: rgba(0,0,0,.45); color: #fff; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--forest); color: var(--cream); padding: 10px 16px; border-radius: var(--r-m); font-size: .86rem; box-shadow: var(--shadow);
  max-width: calc(100vw - 32px);
}
.modal-back { position: fixed; inset: 0; background: rgba(15,22,19,.45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--r-l); max-width: 720px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; padding: 22px; box-shadow: var(--shadow); }

/* ---------- Page body ---------- */
.side-link { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-m); color: var(--ink-2); text-decoration: none; font-size: .9rem; border: 0; background: none; text-align: left; }
.main { container-type: inline-size; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px; min-width: 0; max-width: 1240px; }
.topline { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: .7rem; text-transform: uppercase; letter-spacing: .16em; color: var(--sage-text); font-weight: 500; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--gold); flex: none; }
@container (max-width: 860px) { .main { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); } }

/* Dashboard */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer; }
.kpi:hover { border-color: var(--emerald-2); }
.kpi b { font-family: var(--font-display); font-size: 2rem; font-weight: 400; line-height: 1.1; color: var(--forest); }
.kpi span { font-size: .82rem; color: var(--ink-2); }
.kpi small { font-size: .74rem; color: var(--ink-3); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@container (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .dash-grid { grid-template-columns: minmax(0, 1fr); } }
@container (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.list { display: flex; flex-direction: column; }
.list-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.date-block { width: 50px; text-align: center; border-radius: var(--r-m); background: var(--sunk); padding: 5px 0; line-height: 1.1; }
.date-block b { display: block; font-family: var(--font-display); font-size: 1.25rem; font-weight: 400; color: var(--forest); }
.date-block small { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.progress { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--emerald-2); border-radius: 99px; }
.stage-steps { display: flex; gap: 4px; }
.stage-steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--sunk); }
.stage-steps i.on { background: var(--emerald-2); }

/* Profile */
.profile-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 20px; }
.fact .k { font-size: .74rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; font-weight: 500; }
.fact .v { font-size: .92rem; }
.profile-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@container (max-width: 980px) { .profile-grid, .profile-head { grid-template-columns: minmax(0, 1fr); } }
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.tl::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--emerald-2); background: var(--surface); margin-top: 3px; position: relative; z-index: 1; }
.tl-dot.done { background: var(--emerald-2); }
.tl-dot.later { border-color: var(--line); }
.scope-group { display: flex; flex-direction: column; gap: 0; }
.scope-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.scope-row:last-child { border-bottom: 0; }
.scope-code { font-family: var(--font-data); font-size: .78rem; color: var(--ink-3); }
.switch { width: 34px; height: 20px; border-radius: 99px; background: var(--line); position: relative; border: 0; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--emerald-2); }
.switch[aria-checked="true"]::after { left: 17px; }
@container (max-width: 560px) { .scope-row { grid-template-columns: 34px minmax(0, 1fr) auto; } .scope-row .chip { grid-column: 2 / -1; justify-self: start; } }
.locked { border: 1px dashed var(--brass); background: var(--brass-tint); }

/* Phone shell (client) */
.phone { display: flex; flex-direction: column; min-height: 760px; background: var(--paper); }
.phone-top { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.phone-body { padding: 18px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.phone-foot { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 18px; display: flex; gap: 10px; }
.tabbar { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); }
.tabbar button { border: 0; background: none; padding: 9px 4px 11px; font-size: .72rem; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
.tabbar button[aria-current="page"] { color: var(--emerald); font-weight: 500; }
.tabbar .icon { width: 20px; height: 20px; }
.steps-bar { display: flex; gap: 4px; }
.steps-bar i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps-bar i.on { background: var(--emerald-2); }
.choice-list { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.choice[aria-pressed="true"] { border-color: var(--emerald-2); background: var(--emerald-tint); }
.choice .box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--ink-3); display: grid; place-items: center; flex: none; }
.choice[aria-pressed="true"] .box { background: var(--emerald-2); border-color: var(--emerald-2); }
.choice[aria-pressed="true"] .box::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--on-emerald); border-bottom: 2px solid var(--on-emerald); transform: rotate(-45deg) translate(1px, -1px); }
.upload { border: 1.5px dashed var(--line); border-radius: var(--r-l); padding: 18px; text-align: center; background: var(--surface); display: flex; flex-direction: column; gap: 8px; align-items: center; }
.file-row { display: flex; gap: 10px; align-items: center; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); font-size: .86rem; }

/* Visit (tablet) shell */
.visit-top { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.visit { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 760px; }
.rooms { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; }
.room-btn { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: var(--r-m); border: 1px solid transparent; background: none; text-align: left; cursor: pointer; width: 100%; }
.room-btn:hover { background: var(--sunk); }
.room-btn[aria-current="true"] { background: var(--emerald-tint); border-color: transparent; }
.room-btn b { font-weight: 500; font-size: .92rem; }
.room-btn small { font-size: .74rem; color: var(--ink-3); }
.visit-main { padding: 20px 22px 40px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@container (max-width: 820px) {
  .visit { grid-template-columns: minmax(0, 1fr); }
  .rooms { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .room-btn { min-width: 150px; }
  .rooms .rooms-actions { display: none; }
  .visit-main { padding: 16px; }
}
.point-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.point { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: var(--r-m); border: 1px solid var(--line); background: var(--surface); }
.point .scope-code { font-size: .72rem; }
.prompt { border-left: 3px solid var(--brass); background: var(--brass-tint); padding: 12px 14px; border-radius: 0 var(--r-m) var(--r-m) 0; display: flex; flex-direction: column; gap: 8px; }
.prompt ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; font-size: .88rem; }
.reading-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
.reading-val { font-family: var(--font-data); font-size: 1.3rem; font-weight: 500; }
.reading-val small { font-size: .78rem; color: var(--ink-3); margin-left: 3px; }
.ctx { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .78rem; color: var(--ink-3); grid-column: 1 / -1; }
.ctx b { color: var(--ink-2); font-weight: 500; }
.quick-note { display: flex; gap: 8px; align-items: flex-start; }
.mic { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; color: var(--emerald); }
.mic[aria-pressed="true"] { background: var(--extreme-bg); color: var(--extreme); border-color: transparent; }
.sample-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.sample-row:last-child { border-bottom: 0; }
.sample-row > .chip { align-self: start; }

/* Bedroom */
.bed-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@container (max-width: 900px) { .bed-layout { grid-template-columns: minmax(0, 1fr); } }
.mattress { position: relative; padding: 34px 10px 10px; border-radius: 18px; background: var(--sunk); }
.mattress::before { content: "Headboard wall"; position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.pillows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 18px 8px; }
.pillows i { height: 12px; border-radius: 8px; background: var(--line); }
.mgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cell { min-height: 92px; border-radius: var(--r-m); border: 2px solid transparent; padding: 8px 9px; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; cursor: pointer; text-align: left; background: var(--surface); }
.cell[aria-pressed="true"] { border-color: var(--ink); }
.cell .pos { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.cell .v { font-family: var(--font-data); font-size: 1.05rem; font-weight: 500; }
.cell .v small { font-size: .7rem; color: var(--ink-3); }
.cell .lab { font-size: .7rem; font-weight: 500; }
.cell.k-none { background: var(--ok-bg); } .cell.k-none .lab { color: var(--ok); }
.cell.k-slight { background: var(--slight-bg); } .cell.k-slight .lab { color: var(--slight); }
.cell.k-strong { background: var(--strong-bg); } .cell.k-strong .lab { color: var(--strong); }
.cell.k-extreme { background: var(--extreme-bg); } .cell.k-extreme .lab { color: var(--extreme); }
.cell.k-nc { background: var(--surface); } .cell.k-nc .lab { color: var(--ink-2); }
.cell.k-nm { background: repeating-linear-gradient(135deg, var(--surface) 0 6px, var(--sunk) 6px 12px); } .cell.k-nm .lab { color: var(--ink-3); }
.compare-v { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-family: var(--font-data); font-size: .86rem; }
.compare-v .arrow { color: var(--ink-3); }
.axes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.axis { background: var(--sunk); border-radius: var(--r-m); padding: 8px 10px; }
.axis .k { font-size: .7rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.axis .v { font-family: var(--font-data); font-size: 1.05rem; }
.axis.res { background: var(--emerald-tint); }
.coverage { position: relative; height: 66px; margin-top: 6px; }
.coverage .track { position: absolute; left: 0; right: 0; top: 28px; height: 16px; border-radius: 4px; background: repeating-linear-gradient(135deg, var(--sunk) 0 5px, var(--line) 5px 10px); }
.coverage .cov { position: absolute; top: 28px; height: 16px; background: var(--emerald-2); border-radius: 4px; opacity: .85; }
.coverage .band { position: absolute; top: 0; font-size: .64rem; color: var(--ink-2); transform: translateX(-50%); white-space: nowrap; }
.coverage .tick { position: absolute; top: 24px; width: 1px; height: 24px; background: var(--ink); }
.coverage .axislab { position: absolute; top: 50px; font-size: .64rem; color: var(--ink-3); transform: translateX(-50%); white-space: nowrap; font-family: var(--font-data); }
.plan > svg { width: 100%; height: auto; display: block; }
.plan > svg text { font-family: var(--font-body); }
.pin { cursor: pointer; }

/* Finding editor */
.editor { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@container (max-width: 1180px) { .editor { grid-template-columns: minmax(0, 1fr) 300px; } .editor .finding-list { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
@container (max-width: 820px) { .editor { grid-template-columns: minmax(0, 1fr); } }
.finding-item { display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border-radius: var(--r-m); cursor: pointer; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.finding-item:hover { background: var(--sunk); }
.finding-item[aria-current="true"] { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }

.crumbs a:hover { text-decoration: underline; }
.ref-badge { display: inline-block; font-family: var(--font-display); font-size: .95rem; color: var(--forest); border: 1px solid var(--gold); padding: 1px 8px; border-radius: var(--r-s); white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; letter-spacing: .02em; background: var(--cream); }
.ref-badge.lg { font-size: 1.45rem; padding: 3px 14px; }

.ref-preview b { font-family: var(--font-display); font-weight: 400; font-size: 2rem; color: var(--forest); line-height: 1.1; font-variant-numeric: lining-nums; }
.client-table tr[data-action] { cursor: pointer; }
.client-table tr[data-action]:hover td, .client-table tr[data-action]:focus-visible td { background: var(--sunk); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-size: .9rem; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--forest); border-bottom-color: var(--forest); font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@container (max-width: 700px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px 16px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.tile:hover { border-color: var(--fern); }
.tile b { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; color: var(--forest); line-height: 1.1; font-variant-numeric: lining-nums; }
.tile span { font-size: .82rem; color: var(--ink-2); }
.test-row { display: grid; grid-template-columns: 40px 32px minmax(0, 1fr) auto 80px auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
@container (max-width: 640px) { .test-row { grid-template-columns: 40px 32px minmax(0, 1fr) auto; } .test-row .chip { grid-column: 3 / -1; justify-self: start; } .test-row > .num { grid-column: 3; text-align: left !important; } }
.field .err { color: var(--extreme); font-size: .76rem; }
.input[aria-invalid="true"] { border-color: var(--extreme); }
.choice input[type="radio"] { accent-color: var(--forest); margin-top: 3px; align-self: flex-start; }

.eq-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }

.paper-foot { border-top: 1px solid var(--line); padding-top: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }

.paper h1 { font-size: 2.3rem; }
.paper p, .paper li { max-width: 68ch; line-height: 1.65; }

.draft-mark { align-self: flex-start; }

.check { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; font-size: .86rem; }
.check .st { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: .7rem; font-weight: 500; }
.st-ok { background: var(--ok-bg); color: var(--ok); }
.st-wait { background: var(--slight-bg); color: var(--slight); }

.action-item:last-child { border-bottom: 0; }
.action-n { width: 28px; height: 28px; border-radius: 50%; background: var(--emerald); color: var(--on-emerald); display: grid; place-items: center; font-family: var(--font-display); font-size: .95rem; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 4px 12px; font-size: .86rem; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
@container (max-width: 480px) { .kv { grid-template-columns: minmax(0, 1fr); } .kv dd { margin-bottom: 6px; } }

/* Portal */
.portal-hero { background: var(--forest); color: var(--cream); border-radius: var(--r-m); padding: 20px; display: flex; flex-direction: column; gap: 10px; outline: 1px solid var(--gold); outline-offset: -7px; }

.portal-hero p { opacity: .9; font-size: .92rem; }
.ring { width: 64px; height: 64px; flex: none; }
.act { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px; display: flex; flex-direction: column; gap: 10px; }

.act.done h3 { text-decoration: line-through; text-decoration-color: var(--ink-3); }
.tick { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: var(--surface); cursor: pointer; display: grid; place-items: center; flex: none; }
.tick[aria-checked="true"] { background: var(--emerald-2); border-color: var(--emerald-2); }
.tick[aria-checked="true"]::after { content: ""; width: 10px; height: 6px; border-left: 2px solid var(--on-emerald); border-bottom: 2px solid var(--on-emerald); transform: rotate(-45deg) translate(1px, -1px); }
.bubble { padding: 11px 13px; border-radius: 14px; font-size: .9rem; max-width: 88%; }
.bubble.me { background: var(--emerald-tint); align-self: flex-end; border-bottom-right-radius: 4px; }
.bubble.them { background: var(--surface); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }

/* =========================================================================
   Storage
   Shared storage when the page is published (Iza and Alfie see the same records);
   this browser's storage when the file is opened locally. Example records are
   built into the page and never written to storage.
   ========================================================================= */
const LOCAL_KEY = "emerald-grey-studio-v1";
const COLLECTIONS = ["clients", "readings", "samples", "refs", "sheets", "mattress"];
const Store = {
  mode: "starting", note: "", readOnly: false, db: null, queue: {},
  clients: {}, readings: {}, samples: {}, refs: {}, sheets: {}, mattress: {},
  loadLocal() {
    try { const d = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); COLLECTIONS.forEach(k => { this[k] = d[k] || {}; }); }
    catch (e) { this.note = "This browser is not keeping data, so changes last until the page is closed."; }
  },
  persistLocal() {
    if (this.mode !== "local") return;
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ clients: this.clients, readings: this.readings, samples: this.samples, refs: this.refs, sheets: this.sheets, mattress: this.mattress })); }
    catch (e) { this.note = "This browser is not keeping data, so changes last until the page is closed."; }
  },
  async init() {
    let db = null;
    try { db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { this.mode = "local"; this.loadLocal(); scheduleRender(); return; }
    this.db = db; this.mode = "shared";
    let confirmed = false;
    const timer = setTimeout(() => { if (!confirmed) { this.note = "Shared storage can't be reached yet. Records shown may be out of date."; scheduleRender(); } }, 10000);
    COLLECTIONS.forEach(name => {
      db.collection(name).onSnapshot(snap => {
        const next = {};
        snap.docs.forEach(d => { next[d.id] = d.data(); });
        this[name] = next;
        if (name === "sheets") sheetVer++;
        if (!snap.metadata.fromCache && !confirmed) { confirmed = true; clearTimeout(timer); this.note = ""; }
        scheduleRender();
      }, () => { clearTimeout(timer); this.note = "Shared storage has stopped responding. New changes may not be saved."; scheduleRender(); });
    });
  },
  /* Whole-document write, one at a time per document */
  async put(coll, id, body) {
    this[coll] = { ...this[coll], [id]: body };
    if (this.mode !== "shared") { this.persistLocal(); return true; }
    const key = coll + "/" + id;
    const run = () => this.db.doc(key).set(body);
    const p = (this.queue[key] || Promise.resolve()).then(run, run);
    this.queue[key] = p.catch(() => {});
    try { await p; return true; } catch (e) { this.fail(e); return false; }
  },
  fail(e) {
    const code = e && e.code;
    if (code === "invalid_argument") { this.readOnly = true; toast("Your access lets you view these records but not change them."); }
    else if (code === "quota_exceeded") toast("Storage is full, so this could not be saved.");
    else toast("That change could not be saved. Please try again.");
  },
  nextNum() {
    const nums = [...Object.values(this.refs), ...Object.values(this.clients)].map(x => x.num || 0);
    return Math.max(REF_START - 1, ...nums) + 1;
  },
  /* Claim the next free reference. In shared storage a short lease stops two people taking the same number. */
  async claimRef() {
    let n = this.nextNum();
    for (let tries = 0; tries < 25; tries++, n++) {
      const ref = fmtRef(n);
      if (this.refs[ref] || this.clients[ref]) continue;
      const claim = { ref, num: n, claimedAt: new Date().toISOString(), by: ASSESSOR };
      if (this.mode === "shared") {
        const d = this.db.doc("refs/" + ref);
        const lease = await d.acquire({ holder: TAB_ID, ttlMs: 5000 });
        if (!lease.acquired) continue;
        const snap = await d.get();
        if (snap.exists) continue;
        await d.set(claim);
      }
      this.refs = { ...this.refs, [ref]: claim };
      this.persistLocal();
      return claim;
    }
    throw new Error("No free reference");
  }
};

function testStatus(ref, code) {
  if (!alloc(ref)[code]) return "excluded";
  if (isFixture(ref) && SCOPE[code][0] !== "excluded") return SCOPE[code][0];
  const rs = readingsFor(ref).filter(r => r.point === code);

function testsTab(c) {

/* ---------- RF coverage of the two meters, shown on the radio-frequency section ---------- */
function rfCoverage() {
  const meters = [inst("hf38"), inst("hfw35")];
  const pos = f => ((Math.log10(f) - 1) / 3) * 100;
  const bands = [["FM", 100, 0], ["TETRA", 400, 1], ["Mobile 800", 800, 0], ["DECT", 1900, 1], ["Wi-Fi 2.4", 2450, 0], ["Wi-Fi 5", 5500, 0], ["Wi-Fi 6E", 6500, 1]];
  return `<div class="stack" style="gap:2px">
      <span class="small"><b>Equipment coverage</b> · ${meters.map(m => `${m.name} (${m.fmin >= 1000 ? m.fmin / 1000 + " GHz" : m.fmin + " MHz"} to ${m.fmax / 1000} GHz)`).join(" and ")}</span>
      <div class="coverage" aria-label="Meters cover about 700 MHz to 6 GHz. Below 700 MHz and above 6 GHz are outside coverage.">
        <div class="track"></div>
        ${meters.map((m, i) => `<div class="cov" style="left:${pos(m.fmin)}%;width:${pos(m.fmax) - pos(m.fmin)}%;opacity:${i ? .65 : .9}"></div>`).join("")}
        ${bands.map(([n, f, row]) => `<span class="tick" style="left:${pos(f)}%"></span><span class="band" style="left:${pos(f)}%;top:${row * 11}px">${n}</span>`).join("")}
        ${[[10, "10 MHz"], [100, "100 MHz"], [1000, "1 GHz"], [10000, "10 GHz"]].map(([f, l]) => `<span class="axislab" style="left:${Math.min(96, Math.max(4, pos(f)))}%">${l}</span>`).join("")}
      </div>
    </div>
    <div class="notice notice-warn">${icon("info")}<span class="small">Below 700 MHz (FM, DAB, TETRA, some TV) and above 6 GHz (Wi-Fi 6E) are outside your meters' range. This caveat carries into the finding and report automatically.</span></div>`;

/* ---------- 6. Finding and recommendation editor ---------- */
function screenFinding() {
  if (!isFixture(S.client)) return findingsFromStore();
  const f = findingById(S.findingId);
  const rs = f.readings.map(id => READINGS.find(r => r.id === id)).filter(Boolean);
  const main = rs[0];
  const refsFor = { A1: ["sbm-ef", "sbm-bv", "icnirp-ef"], A3: ["sbm-rf"], B6: ["sbm-co2", "bb-co2"], S5: [], S3: [] }[f.point] || [];
  const refCard = id => {
    const r = REF[id]; const k = REF_KIND[r.kind];
    const reading = rs.find(x => x.ref === id) || (id === "icnirp-ef" ? rs[0] : id === "bb-co2" ? rs[0] : null);
    let verdict = "";
    if (r.bands && reading) {
      const c = classify(reading.value, id, reading.method);
      verdict = `<div class="band-scale">${["none", "slight", "strong", "extreme"].map((b, j) => `<div class="${EVAL[b].cls} ${c === b ? "here" : ""}">${EVAL[b].label.replace(" anomaly", "")}<br><span class="mono">${j === 0 ? "<" + r.bands[0] : j === 3 ? "≥" + r.bands[2] : r.bands[j - 1] + " to " + r.bands[j]}</span></div>`).join("")}</div>
        <span class="small">${fmt(reading.value)} ${r.unit} → ${evalChip(c)}</span>`;
    } else if (r.limit && reading) {
      verdict = `<span class="small">Reference ${fmt(r.limit)} ${r.unit}. Measured ${fmt(reading.value)} ${r.unit}: <b>below this reference</b>. This does not mean the sleeping-area guidance is met.</span>`;
    }
    return `<div class="ref-card ${r.kind === "sbm" ? "sbm" : ""}"><span class="chip ${k.cls}" style="align-self:flex-start">${k.label}</span><b class="small">${r.quantity}</b><span class="xsmall muted">${r.source} · Edition ${r.edition} · Unit ${r.unit}</span><span class="xsmall">${r.conditions}</span>${verdict}</div>`;
  };
  return assessorShell("finding", `
    ${crumbs("Findings")}
    <div class="topline"><div><span class="eyebrow">EG-001 · report v1.1</span><h1>Findings and recommendations</h1></div>

    <div class="editor">
      <nav class="finding-list stack" style="gap:4px" aria-label="Findings">
        ${FINDINGS.map(x => `<button class="finding-item" data-action="finding" data-id="${x.id}" aria-current="${x.id === f.id}"><span class="xsmall muted">${x.room} · ${x.point}</span><b class="small">${x.title}</b><span class="row" style="gap:6px"><span class="chip ${x.status === "approved" ? "c-ok" : "c-muted"}">${x.status === "approved" ? "Approved" : "Draft"}</span><span class="xsmall muted">${x.by} · ${x.edited}</span></span></button>`).join("")}
        <button class="btn btn-s" style="margin-top:6px" data-action="toast" data-msg="New finding created from selected readings">${icon("plus")}New finding</button>
      </nav>
      <div class="card stack-l">
        <div class="spread"><div><span class="eyebrow">${f.room} · ${f.point} ${POINT_NAME[f.point]}</span><h2>${f.title}</h2></div><span class="chip ${f.status === "approved" ? "c-ok" : "c-muted"}">${f.status === "approved" ? "Approved" : "Draft"}</span></div>
        <div class="stack"><h4>Linked evidence</h4>
          ${rs.length ? `<div class="table-wrap"><table><thead><tr><th>Reading</th><th class="num">Value</th><th>Type</th><th>Evaluation</th></tr></thead><tbody>${rs.map(r => `<tr><td><span class="mono xsmall">${r.id}</span> ${r.label}${r.phase === "after" ? " <span class='tag'>After</span>" : ""}</td><td class="num mono">${r.value ?? ""} ${r.unit}</td><td class="small">${RESULT[r.result]}</td><td>${evalChip(readingEval(r))}</td></tr>`).join("")}</tbody></table></div>` : `<p class="small muted">No readings linked. A written professional assessment is required.</p>`}
          <div class="row"><span class="chip c-muted">${icon("photo")}2 photographs</span><span class="chip c-muted">${icon("grid")}Bed grid</span><span class="chip c-muted">${icon("doc")}Room plan</span></div>
        </div>
        <div class="field"><label for="fe-found">What we found</label><textarea id="fe-found" class="input" rows="6" data-input="edit">${esc(f.found)}</textarea></div>
        <div class="field"><div class="spread"><label for="fe-why">Why it matters</label><button class="btn btn-quiet btn-s" data-action="explain">${icon("book")}Insert reusable explanation</button></div>
          ${S.explanationOpen ? `<div class="card card-tight stack" style="background:var(--sunk)">${EXPLANATIONS.map(x => `<button class="finding-item" data-action="useexplain" data-id="${x.id}"><b class="small">${x.title}</b><span class="xsmall muted">${x.text.slice(0, 110)}…</span></button>`).join("")}</div>` : ""}
          <textarea id="fe-why" class="input" rows="5" data-input="edit" placeholder="Explain in plain language. Insert a reusable explanation and adapt it to this home.">${esc(f.why)}</textarea><span class="hint">Reusable text stays editable here. Changes apply to this report only.</span></div>
        <div class="field"><label for="fe-what">What you can do</label><textarea id="fe-what" class="input" rows="5" data-input="edit">${esc(f.what)}</textarea></div>

        <div class="spread"><span class="xsmall muted">Last edited by ${f.by} · ${f.edited} · every change is attributed and versioned</span>
          <div class="row"><button class="btn" data-action="toast" data-msg="Saved as draft">Save draft</button><button class="btn btn-primary" data-action="approve">${f.status === "approved" ? "Approved" : "Approve finding"}</button></div></div>
      </div>
      <aside class="stack" aria-labelledby="h-ref">
        <h3 id="h-ref">Reference criteria</h3>
        <p class="xsmall muted">Classifications appear only where the method and available information support them. SBM guidance is shown separately from statutory and other references.</p>
        ${refsFor.length ? refsFor.map(refCard).join("") : `<div class="ref-card"><b class="small">No applicable numerical guideline</b><span class="small">Write a professional assessment. It will be labelled as such in the report.</span><textarea class="input" rows="4" aria-label="Professional assessment">Flow at the grille is below the rate expected for a bathroom, and surface moisture at the window reveal is elevated the morning after showering.</textarea></div>`}
        ${main && main.inst === "hf38" ? `<div class="notice notice-warn">${icon("info")}<span class="small">Combined coverage of the HF38B-W and HFW35C is about 700 MHz to 6 GHz. Sources outside that range, including Wi-Fi 6E, are not captured. Caveat included in the report text.</span></div>` : ""}
        <div class="notice notice-muted">${icon("info")}<span class="xsmall">Reference values in this prototype are placeholders for design review. Each entry is confirmed against the licensed edition before release.</span></div>
      </aside>
    </div>`);
}

/* Reference entry chosen from the test, unit and method, so classification only appears where it applies */
function refFor(point, unit, method) {
  if (point === "A1" && unit === "V/m") return method === "earthed" ? "sbm-ef" : method === "potential-free" ? "sbm-ef-pf" : null;
  if (point === "A1" && unit === "mV" && method === "body-voltage") return "sbm-bv";
  if (point === "A2" && unit === "nT" && method === "three-axis") return "sbm-mf";
  if (point === "A3" && unit === "µW/m²" && method === "peak") return "sbm-rf";
  if (point === "B6" && unit === "ppm") return "sbm-co2";
  return null;
}

function csvPreview(text, name) {
  const rows = text.trim().split(/\r?\n/).map(l => l.split(","));
  const head = rows[0] || [], data = rows.slice(1);
  const numCol = head.findIndex((h, i) => i > 0 && data.every(r => !isNaN(parseFloat(r[i]))));
  const vals = numCol > 0 ? data.map(r => parseFloat(r[numCol])) : [];
  const max = vals.length ? Math.max(...vals) : 0, min = vals.length ? Math.min(...vals) : 0;
  const w = 600, h = 120, pad = 24;
  const pts = vals.map((v, i) => [pad + (i / Math.max(1, vals.length - 1)) * (w - pad * 2), h - pad - ((v - min) / Math.max(1, max - min)) * (h - pad * 2)]);
  return `<div class="stack">
    <div class="spread small"><b>${esc(name)}</b><span class="muted">${data.length} rows · ${head.length} columns</span></div>
    <div class="grid-3">${head.map((c, i) => `<div class="field"><label for="map-${i}">${esc(c)}</label><select id="map-${i}" class="input">${["Timestamp", "CO₂ (ppm)", "Temperature (°C)", "Relative humidity (%)", "Pressure (hPa)", "Ignore"].map((o, j) => `<option ${j === Math.min(i, 4) ? "selected" : ""}>${o}</option>`).join("")}</select></div>`).join("")}</div>
    ${vals.length > 1 ? `<div class="table-wrap" style="padding:8px"><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Preview of ${esc(head[numCol])}, ${fmt(min)} to ${fmt(max)}">
      <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="var(--line)"/>
      <polyline fill="none" stroke="var(--emerald-2)" stroke-width="2" points="${pts.map(p => p.join(",")).join(" ")}"/>
      ${pts.length ? `<circle cx="${pts[vals.indexOf(max)][0]}" cy="${pts[vals.indexOf(max)][1]}" r="4" fill="var(--emerald)"/><text x="${pts[vals.indexOf(max)][0]}" y="${pts[vals.indexOf(max)][1] - 8}" font-size="11" text-anchor="middle" fill="var(--ink)">Max ${fmt(max)}</text>` : ""}
      <text x="${pad}" y="${h - 6}" font-size="10" fill="var(--ink-3)">${esc(data[0][0])}</text><text x="${w - pad}" y="${h - 6}" font-size="10" fill="var(--ink-3)" text-anchor="end">${esc(data[data.length - 1][0])}</text>
    </svg></div>` : ""}
    <p class="xsmall muted">Equipment detected from the file: ${inst("aranet4").name}. Imported as overnight monitoring linked to Main bedroom. Context fields can be completed after import.</p></div>`;
}

const BEDROOMS = [{ id: "bed1", name: "Master bedroom" }, { id: "bed2", name: "Bedroom 2" }, { id: "bed3", name: "Bedroom 3" }, { id: "bed4", name: "Bedroom 4" }];
const MT_POS = ["Top left", "Top centre", "Top right", "Middle left", "Middle centre", "Middle right", "Bottom left", "Bottom centre", "Bottom right"];
const AXES = ["X", "Y", "Z"];
const MT_TESTS = {
  pf: { label: "Potential-free AC electric field", short: "Potential-free electric field", unit: "V/m", point: "A1", method: "potential-free", inst: null },
  gr: { label: "Ground-referenced AC electric field", short: "Ground-referenced electric field", unit: "V/m", point: "A1", method: "earthed", inst: "me3951" },
  mf: { label: "AC magnetic field", short: "Magnetic field", unit: "nT", point: "A2", method: "three-axis", inst: "me3951" }
};
const VISIT = { id: "v1", label: "Visit 1" };
const MATTRESS_SIZES = [["single", "Single", "90 × 190 cm"], ["smalldouble", "Small double", "120 × 190 cm"], ["double", "Double", "135 × 190 cm"], ["king", "King", "150 × 200 cm"], ["superking", "Super king", "180 × 200 cm"], ["emperor", "Emperor (PSCL special size)", "approx. 213 × 198 cm"]];
const sizeLabel = k => { const m = MATTRESS_SIZES.find(x => x[0] === k); return m ? `${m[1]}, ${m[2]}` : ""; };
const MT_TOTAL = MT_POS.length * AXES.length;
const POS_STATUS = { notstarted: ["○", "Not started", "c-outline"], progress: ["◐", "In progress", "c-slight"], complete: ["●", "Complete", "c-emerald"], nm: ["×", "Not measured", "c-muted"] };
const NUM_OK = /^\d+(\.\d+)?$/;

const mtRoom = () => BEDROOMS.some(b => b.id === S.room) ? S.room : "bed1";
const bedName = id => (BEDROOMS.find(b => b.id === id) || {}).name || id;
const mtId = (ref, room, ds, run) => `${ref}__${VISIT.id}__${room}__${ds}__r${run}`;
const mtKey = k => `${Math.floor(k / 3)}|${k % 3}`;
const mtFilled = e => !!e && (e.nm === true || typeof e.v === "number");

function bedroomInfo(ref, id) {
  const c = getClient(ref); if (!c) return {};
  if (c.example) return (S.exBedrooms[ref] || {})[id] || {};
  return { ...((c.bedrooms || {})[id] || {}), ...((S.bedDraft[ref] || {})[id] || {}) };
}
/* The worked example keeps its magnetic-field readings as a completed test */
function mtSeed(ref, room, ds) {
  if (ref !== "EG-001" || room !== "bed1" || ds !== "mf") return null;
  const cells = {};
  GRID.mf.before.forEach((xyz, p) => xyz.forEach((v, a) => { cells[`${p}|${a}`] = { v, nm: false, by: "Alfie", at: "2026-10-09T19:45:00", hist: [] }; }));
  return { ref, visit: VISIT.id, room, ds, run: 1, cells, startedAt: "2026-10-09T19:41:00", updatedAt: "2026-10-09T19:52:00", updatedBy: "Alfie", completedAt: "2026-10-09T19:53:00", completedBy: "Alfie" };
}
function mtRuns(ref, room, ds) {
  const prefix = `${ref}__${VISIT.id}__${room}__${ds}__r`;
  const runs = Object.entries(Store.mattress).filter(([id]) => id.startsWith(prefix)).map(([, d]) => d);
  const seed = mtSeed(ref, room, ds);
  if (seed && !runs.some(d => d.run === seed.run)) runs.push(seed);
  return runs.sort((a, b) => a.run - b.run);
}
function mtDoc(ref, room, ds) {
  const runs = mtRuns(ref, room, ds);
  return runs[runs.length - 1] || { ref, visit: VISIT.id, room, ds, run: 1, cells: {}, startedAt: null };
}
const mtDone = doc => Object.values(doc.cells || {}).filter(mtFilled).length;
function mtPosStatus(doc, p) {
  const e = [0, 1, 2].map(a => (doc.cells || {})[`${p}|${a}`]);
  const n = e.filter(mtFilled).length;
  if (!n) return "notstarted";
  if (n < 3) return "progress";
  return e.every(x => typeof x.v === "number") ? "complete" : "nm";
}
function mtResultant(doc, p) {
  const v = [0, 1, 2].map(a => ((doc.cells || {})[`${p}|${a}`] || {}).v);
  if (!v.every(x => typeof x === "number")) return null;
  return Math.sqrt((v[0] * v[0]) + (v[1] * v[1]) + (v[2] * v[2]));
}
function mtFirstIncomplete(doc, from = 0) {
  for (let i = 0; i < MT_TOTAL; i++) { const k = (from + i) % MT_TOTAL; if (!mtFilled((doc.cells || {})[mtKey(k)])) return k; }
  return -1;
}
function mtCurrent(doc) {
  const id = mtId(doc.ref, doc.room, doc.ds, doc.run);
  if (S.mt.idx[id] != null) return S.mt.idx[id];
  const k = mtFirstIncomplete(doc); return k < 0 ? MT_TOTAL - 1 : k;
}
const fmtVal = (v, unit) => `${fmt(v, 1)} ${unit}`;

/* Results from the mattress tests, for the client record and report (latest test per room) */
function mattressReadings(ref) {
  const out = [];
  BEDROOMS.forEach(b => Object.entries(MT_TESTS).forEach(([ds, t]) => {
    const doc = mtDoc(ref, b.id, ds); if (!mtDone(doc)) return;
    MT_POS.forEach((pos, p) => {
      const r = mtResultant(doc, p); if (r == null) return;
      const axes = [0, 1, 2].map(a => doc.cells[`${p}|${a}`].v), last = doc.cells[`${p}|2`];
      out.push({ id: `${mtId(ref, b.id, ds, doc.run)}:${p}`, client: ref, room: b.id, roomType: "bedroom", test: "a2", point: t.point,
        label: `${t.short}, ${pos}, 3D resultant`, value: Math.round(r * 10) / 10, axes, unit: t.unit, method: t.method,
        methodLabel: `Nine-point mattress test, X, Y and Z with the resultant calculated`, ref: refFor(t.point, t.unit, t.method), evalKey: null,
        inst: t.inst, timing: "spot", result: "reading", when: nowStampFrom(last.at), by: last.by, phase: null,
        grid: { qty: ds, pos: p }, loc: `${bedName(b.id)}, ${pos}`, cond: {}, note: "", createdAt: last.at });
    });
  }));
  return out;
}
function nowStampFrom(iso) { try { return new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } }

/* ---------- Saving ---------- */
async function mtSave(doc) {
  const c = getClient(doc.ref), t = MT_TESTS[doc.ds], bed = bedroomInfo(doc.ref, doc.room);
  const body = { ...doc, customer: c.name, property: [c.propertyName, addrLine(c)].filter(Boolean).join(", "), visitLabel: VISIT.label,
    roomName: bedName(doc.room), bed: bed.bed || "", mattressSize: sizeLabel(bed.size), testType: t.label, method: t.method, unit: t.unit, updatedAt: new Date().toISOString(), updatedBy: ASSESSOR };
  const ok = await Store.put("mattress", mtId(doc.ref, doc.room, doc.ds, doc.run), body);
  if (ok) { const a = alloc(doc.ref); if (!a[t.point]) await setAlloc(doc.ref, { ...a, [t.point]: true }); }
  return ok;
}
async function mtConfirm(nm) {
  const pad = S.mt.pad; if (!pad) return;
  const value = nm ? null : parseFloat(pad.buf);
  if (!nm && !NUM_OK.test(pad.buf)) return;
  const base = mtDoc(S.client, mtRoom(), S.mt.ds);
  const doc = JSON.parse(JSON.stringify(base));
  const key = mtKey(pad.k), old = doc.cells[key], now = new Date().toISOString();
  const amend = mtFilled(old);
  doc.cells[key] = { v: value, nm: !!nm, by: ASSESSOR, at: now,
    hist: amend ? [...(old.hist || []), { at: now, by: ASSESSOR, old: old.nm ? "Not measured" : old.v, new: nm ? "Not measured" : value }] : [] };
  doc.startedAt = doc.startedAt || now;
  const ok = await mtSave(doc);
  if (!ok) { toast("That reading could not be saved. Please try again."); return; }
  const id = mtId(doc.ref, doc.room, doc.ds, doc.run), p = Math.floor(pad.k / 3);
  S.modal = null; S.mt.pad = null;
  if (amend) {
    const k = mtFirstIncomplete(doc); S.mt.idx[id] = k < 0 ? pad.k : k;
    toast(`${MT_POS[p]}, ${AXES[pad.k % 3]} changed and saved`);
  } else {
    const next = mtFirstIncomplete(doc, pad.k + 1);
    S.mt.idx[id] = next < 0 ? pad.k : next;
    if (pad.k % 3 === 2 && mtPosStatus(doc, p) !== "progress") {
      S.mt.flash = { p, id };
      clearTimeout(S.mt.flashTimer);
      S.mt.flashTimer = setTimeout(() => { if (S.mt.flash && S.mt.flash.id === id) { S.mt.flash = null; if (!S.modal) render(); } }, 2400);
    }
  }
  render();
}

/* ---------- Screen ---------- */

function mtTable(doc, opts = {}) {

/* ---------- Results on the mattress: drawn to the chosen size, nine points as a heatmap ---------- */
const HEAT = { none: ["--heat-no", "No anomaly"], slight: ["--heat-slight", "Slight anomaly"], strong: ["--heat-severe", "Severe anomaly"], extreme: ["--heat-extreme", "Extreme anomaly"] };
function mtHeat(doc) {
  const t = MT_TESTS[doc.ds], refId = refFor(t.point, t.unit, t.method), bands = REF[refId].bands;
  const sizeKey = bedroomInfo(doc.ref, doc.room).size, size = MATTRESS_SIZES.find(m => m[0] === sizeKey);

  const point = pt => {

    const label = pt.r == null ? status : `${fmt(pt.r, 1)} ${t.unit}, ${HEAT[pt.k][1]}`;

  };

    ${rated.length ? "" : `<div class="notice notice-muted">${icon("info")}<span class="small">No ${t.short.toLowerCase()} results yet in ${bedName(doc.room)}. The heatmap fills in as each position's X, Y and Z readings are confirmed.${others.length ? ` Results are already recorded for ${others.map(ds => `<button class="btn-link" data-action="mtds" data-ds="${ds}">${MT_TESTS[ds].short.toLowerCase()}</button>`).join(" and ")}.` : ""}</span></div>`}
    <div class="heat-wrap">
      <div class="heat-frame" style="width:${Math.round(W * 2.2)}px">
        <div class="heat-head" aria-hidden="true">Headboard</div>
        <div class="heat-bed" style="aspect-ratio:${W} / ${L}" role="group" aria-label="${esc(t.label)} on a ${size ? size[1].toLowerCase() : "double"} mattress, nine points">
          <div class="heat-blobs" aria-hidden="true">${rated.map(pt => `<i style="left:${pt.x}%;top:${pt.y}%;width:${blobW}%;background:radial-gradient(closest-side, var(${HEAT[pt.k][0]}) 0%, var(${HEAT[pt.k][0]}) 35%, transparent 100%)"></i>`).join("")}</div>
          <div class="heat-pillows" aria-hidden="true">${(W >= 120 ? [1, 2] : [1]).map(() => "<i></i>").join("")}</div>
          ${pts.map(point).join("")}
        </div>
        <div class="heat-dims">${W} × ${L} cm</div>
      </div>
    </div>

  togglepart: d => { const el = document.getElementById("navp-" + d.p), open = el.hidden; el.hidden = !open; S.navParts[d.p] = open; document.querySelector(`[data-action=togglepart][data-p="${d.p}"]`).setAttribute("aria-expanded", String(open)); },
  addsheetrow: d => {
    const sec = sectionById(S.screen), tb = sec.tables.find(t => t.k === d.table), room = sheetRoomKey(sec), sh = sheetGet(S.client, room, sec.id);
    const rows = (((sh.t || {})[tb.k] || {}).rows || tb.rows.map(r => rowOf(r).label));
    setSheet(S.client, room, sec.id, `t|${tb.k}|row|${rows.length}`, ""); render();
    document.querySelector(`[data-sheet="t|${tb.k}|row|${rows.length}"]`)?.focus();
  },
  applytemplate: () => {
    const c = C(), key = val("tpl"), t = ROOM_TEMPLATES[key], rs = readingsFor(c.ref);
    const keep = roomsFor(c.ref).filter(r => rs.some(x => x.room === r.id) && !t.rooms.some(tr => tr.id === r.id));
    const rooms = [...t.rooms, ...keep];
    if (c.example) { S.exRooms[c.ref] = rooms; c.roomTemplate = key; render(); }
    else updateClient(c.ref, { rooms, roomTemplate: key }).then(scheduleRender);
    toast(`${t.name} applied${keep.length ? `. ${keep.length} room${keep.length === 1 ? "" : "s"} with saved results kept` : ""}`);
  },
  copydata: () => {
    const text = JSON.stringify({ clients: Store.clients, readings: Store.readings, samples: Store.samples, refs: Store.refs, sheets: Store.sheets, mattress: Store.mattress }, null, 2);
    const box = document.getElementById("data-copy");
