<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emerald Grey Assessment Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap">
<style>
/* Layout concept: a prototype bar above a device stage; each screen renders inside a
   device frame (desktop, tablet, phone) that uses container queries, so the phone and
   tablet layouts are faithful even when viewed on a large monitor. */
/* Emerald Grey Brand Guidelines v3 (November 2026). Light grounds carry the work; forest is
   the deliberate contrast. One light theme by design. Gold is a single accent: hairlines,
   frames and italic emphasis on forest only, because gold on cream is too low in contrast
   for text (2.1:1). Sage and neutral are deepened slightly for small text to reach 4.5:1. */
:root {
  color-scheme: light;
  --forest: #22372B;       /* Forest Green: headlines, primary actions, contrast moments */
  --deep-forest: #2D3D35;  /* Deep Forest: body text */
  --cream: #F8F6F2;        /* Cream: default ground for sheets and cards */
  --linen: #F1ECE6;        /* Linen: app canvas */
  --blush: #F7F0E8;        /* Blush: cover panels and soft highlights */
  --ghost: #EEEBE5;        /* Ghost Stone: oversized numerals and faint panels */
  --stone: #D6D1C4;        /* Warm Stone: hairline rules, pale fills */
  --mid-sage: #6E7C5B;     /* Mid Sage: icons and larger labels */
  --soft-sage: #A9B6A4;    /* Soft Sage: dividers, subtle blocks */
  --gold: #C2A979;         /* Warm Gold: hairlines, frames, emphasis on forest */
  --fern: #35684F;         /* Fern Green: notes, labels and key data */
  --sage-text: #5E6B4C;    /* Mid Sage deepened for small text (5.3:1 on cream) */
  --gold-text: #7C6337;    /* Warm Gold deepened for text on light grounds */

  /* Interface roles, mapped to the brand palette */
  --paper: var(--linen);
  --surface: var(--cream);
  --sunk: var(--ghost);
  --line: var(--stone);
  --ink: var(--deep-forest);
  --ink-2: #4A5650;
  --ink-3: #615D53;        /* captions and metadata, Warm Neutral deepened for legibility */
  --emerald: var(--forest);
  --emerald-2: var(--fern);
  --emerald-tint: #E3E8DF; /* Soft Sage tint */
  --on-emerald: var(--cream);
  --brass: var(--gold);
  --brass-tint: #F3ECDF;
  /* Status colours drawn from the landscape palette, always paired with a text label */
  --ok: var(--fern);  --ok-bg: #E3EBE3;
  --slight: #6F5A22;  --slight-bg: #F1E8D2;
  --strong: #8A4E33;  --strong-bg: #F1E0D6;
  --extreme: #7E2F27; --extreme-bg: #EED6D0;
  --info: #44595A;    --info-bg: #E2E7E4;
  --muted: #5D5A52;   --muted-bg: #ECE8E1;
  --shadow: none;          /* the brand reads flat, matte and tactile */
  --font-display: "Playfair Display", "Iowan Old Style", Georgia, serif;
  --font-accent: "Cormorant Garamond", "Garamond", Georgia, serif;
  --font-body: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-data: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r-s: 3px; --r-m: 4px; --r-l: 6px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; letter-spacing: 0; text-wrap: balance; margin: 0; color: var(--forest); }
b, strong { font-weight: 500; }
em.gold { font-style: italic; color: var(--gold); }
h1 { font-size: 1.95rem; line-height: 1.15; }
h2 { font-size: 1.4rem; line-height: 1.2; }
h3 { font-size: 1.12rem; line-height: 1.25; }
h4 { font-family: var(--font-body); font-size: .72rem; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--sage-text); }
p { margin: 0; }
a { color: var(--sage-text); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--emerald-2); outline-offset: 2px; border-radius: 4px; }
.num, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: .84rem; }
.xsmall { font-size: .76rem; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-l { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Prototype bar ---------- */
.proto-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
.proto-inner { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; max-width: 1320px; margin: 0 auto; }
.wordmark { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.proto-inner > .wordmark { margin-right: auto; }
.wordmark b { font-family: var(--font-accent); font-weight: 500; font-size: 1.08rem; letter-spacing: .24em; text-transform: uppercase; white-space: nowrap; color: var(--forest); display: block; line-height: 1.2; }
.side .wordmark b { font-size: 1rem; letter-spacing: .2em; }
.wordmark span { font-size: .62rem; text-transform: uppercase; letter-spacing: .16em; color: var(--sage-text); display: block; line-height: 1.4; }
.screen-nav { display: flex; gap: 4px; overflow-x: auto; flex: 1 1 100%; order: 3; min-width: 0; padding-bottom: 2px; scrollbar-width: thin; }
.screen-nav button {
  border: 1px solid transparent; background: none; padding: 6px 11px; border-radius: var(--r-m); cursor: pointer;
  white-space: nowrap; font-size: .86rem; color: var(--ink-2);
}
.screen-nav button small { display: block; font-size: .64rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); line-height: 1.1; }
.screen-nav button[aria-current="page"] { background: var(--emerald-tint); color: var(--emerald); border-color: transparent; font-weight: 500; }
.screen-nav button:hover { border-color: var(--line); }
.device-toggle { display: flex; border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.device-toggle button { border: 0; background: none; padding: 5px 12px; font-size: .8rem; cursor: pointer; color: var(--ink-2); }
.device-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ---------- Stage and device frames ---------- */
.stage {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 60px;
}
.stage-caption { max-width: 1320px; margin: 0 auto 14px; display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; align-items: baseline; }
.stage-caption p { max-width: 70ch; color: var(--ink-2); font-size: .9rem; }
.device { container-type: inline-size; margin: 0 auto; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.device[data-device="desktop"] { max-width: 1320px; }
.device[data-device="tablet"] { max-width: 1080px; border-radius: 26px; border-width: 10px; border-color: var(--ink); }
.device[data-device="phone"] { max-width: 400px; border-radius: 34px; border-width: 9px; border-color: var(--ink); }
@media (max-width: 520px) {
  .device[data-device] { border-width: 1px; border-color: var(--line); border-radius: 14px; }
  .stage { padding-block: 12px 40px; }
}

/* ---------- Shared components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px; min-width: 0; }
.card-tight { padding: 14px; }
.card h3 + p { margin-top: 4px; }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 16px; border-radius: var(--r-s); cursor: pointer; font-size: .88rem; font-weight: 500; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn-primary { background: var(--emerald); border-color: var(--emerald); color: var(--on-emerald); }
.btn-primary:hover { background: var(--emerald-2); border-color: var(--emerald-2); }
.btn-quiet { border-color: transparent; background: none; color: var(--emerald); padding-inline: 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-s { padding: 5px 11px; font-size: .8rem; }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: .76rem; font-weight: 500; line-height: 1.6; white-space: nowrap; }
.chip .glyph { font-family: var(--font-data); font-size: .72rem; }
.c-ok { background: var(--ok-bg); color: var(--ok); }
.c-slight { background: var(--slight-bg); color: var(--slight); }
.c-strong { background: var(--strong-bg); color: var(--strong); }
.c-extreme { background: var(--extreme-bg); color: var(--extreme); }
.c-info { background: var(--info-bg); color: var(--info); }
.c-muted { background: var(--muted-bg); color: var(--muted); }
.c-emerald { background: var(--emerald-tint); color: var(--emerald); }
.c-brass { background: var(--brass-tint); color: var(--gold-text); }
.c-outline { border: 1px dashed var(--ink-3); color: var(--ink-2); background: none; }
.tag { display: inline-block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 500; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .field .label { font-size: .8rem; font-weight: 500; color: var(--ink-2); }
.field .hint { font-size: .76rem; color: var(--ink-3); }
.input, select.input, textarea.input {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: 9px 11px; min-height: 40px;
}
textarea.input { min-height: 84px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--emerald-2); outline: none; box-shadow: 0 0 0 3px var(--emerald-tint); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@container (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }

.seg { display: inline-flex; background: var(--sunk); border-radius: var(--r-m); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: var(--r-s); padding: 5px 12px; font-size: .82rem; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 500; border: 1px solid var(--line); }
.pill-check { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: var(--r-m); padding: 7px 13px; cursor: pointer; font-size: .86rem; background: var(--surface); }
.pill-check[aria-pressed="true"] { border-color: var(--emerald-2); background: var(--emerald-tint); color: var(--emerald); font-weight: 500; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 500; background: var(--sunk); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }

.notice { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: var(--r-m); font-size: .86rem; }
.notice-info { background: var(--info-bg); color: var(--ink); }
.notice-warn { background: var(--slight-bg); color: var(--ink); }
.notice-calm { background: var(--emerald-tint); color: var(--ink); }
.notice-muted { background: var(--sunk); color: var(--ink-2); }
.notice .icon { margin-top: 2px; }

.sync { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; color: var(--ink-2); white-space: nowrap; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); flex: none; }
.sync[data-state="offline"] .sync-dot { background: var(--slight); box-shadow: 0 0 0 3px var(--slight-bg); }
.sync[data-state="saving"] .sync-dot { background: var(--info); box-shadow: 0 0 0 3px var(--info-bg); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .74rem; font-weight: 500; flex: none; }
.av-iza { background: var(--emerald-tint); color: var(--emerald); }
.av-alfie { background: var(--brass-tint); color: var(--gold-text); }
.av-client { background: var(--info-bg); color: var(--info); }

.photo {
  aspect-ratio: 4/3; max-width: 100%; border-radius: var(--r-m); position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--sunk), var(--line));
  display: flex; align-items: flex-end; padding: 8px; font-size: .74rem; color: var(--ink-2);
}
.photo.thermal { background: linear-gradient(120deg, #2b2a6b 0%, #7a2a7e 35%, #d4573a 65%, #f2c14e 100%); color: #fff; }
.photo.wall { background: linear-gradient(160deg, var(--sunk) 0%, var(--line) 60%, var(--brass-tint) 100%); }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.photo span { position: relative; background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--ink); padding: 2px 7px; border-radius: 4px; }
.photo.thermal span { background: rgba(0,0,0,.45); color: #fff; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--forest); color: var(--cream); padding: 10px 16px; border-radius: var(--r-m); font-size: .86rem; box-shadow: var(--shadow);
  max-width: calc(100vw - 32px);
}
.modal-back { position: fixed; inset: 0; background: rgba(15,22,19,.45); z-index: 40; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--r-l); max-width: 720px; width: 100%; max-height: calc(100vh - 32px); overflow: auto; padding: 22px; box-shadow: var(--shadow); }

/* ---------- Assessor shell ---------- */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 720px; }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.side .wordmark { padding: 0 8px 16px; }
.side-link { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: var(--r-m); color: var(--ink-2); text-decoration: none; font-size: .9rem; cursor: pointer; border: 0; background: none; text-align: left; }
.side-link:hover { background: var(--sunk); }
.side-link[aria-current="page"] { background: var(--emerald-tint); color: var(--emerald); font-weight: 500; }
.side-link .count { margin-left: auto; font-size: .74rem; font-family: var(--font-data); color: var(--ink-3); }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.main { container-type: inline-size; padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.topline { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: .7rem; text-transform: uppercase; letter-spacing: .16em; color: var(--sage-text); font-weight: 500; }
.eyebrow::before { content: ""; width: 28px; height: 1px; background: var(--gold); flex: none; }
@container (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px; align-items: center; }
  .side .wordmark, .side-foot { display: none; }
  .side-link { white-space: nowrap; }
  .main { padding: 18px 16px 32px; }
}

/* Dashboard */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer; }
.kpi:hover { border-color: var(--emerald-2); }
.kpi b { font-family: var(--font-display); font-size: 2rem; font-weight: 400; line-height: 1.1; color: var(--forest); }
.kpi span { font-size: .82rem; color: var(--ink-2); }
.kpi small { font-size: .74rem; color: var(--ink-3); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@container (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .dash-grid { grid-template-columns: minmax(0, 1fr); } }
@container (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.list { display: flex; flex-direction: column; }
.list-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.date-block { width: 50px; text-align: center; border-radius: var(--r-m); background: var(--sunk); padding: 5px 0; line-height: 1.1; }
.date-block b { display: block; font-family: var(--font-display); font-size: 1.25rem; font-weight: 400; color: var(--forest); }
.date-block small { font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.progress { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--emerald-2); border-radius: 99px; }
.stage-steps { display: flex; gap: 4px; }
.stage-steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--sunk); }
.stage-steps i.on { background: var(--emerald-2); }

/* Profile */
.profile-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 20px; }
.fact .k { font-size: .74rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; font-weight: 500; }
.fact .v { font-size: .92rem; }
.profile-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@container (max-width: 980px) { .profile-grid, .profile-head { grid-template-columns: minmax(0, 1fr); } }
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
.tl::before { content: ""; position: absolute; left: 7px; top: 14px; bottom: 0; width: 2px; background: var(--line); }
.tl:last-child::before { display: none; }
.tl-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--emerald-2); background: var(--surface); margin-top: 3px; position: relative; z-index: 1; }
.tl-dot.done { background: var(--emerald-2); }
.tl-dot.later { border-color: var(--line); }
.scope-group { display: flex; flex-direction: column; gap: 0; }
.scope-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.scope-row:last-child { border-bottom: 0; }
.scope-code { font-family: var(--font-data); font-size: .78rem; color: var(--ink-3); }
.switch { width: 34px; height: 20px; border-radius: 99px; background: var(--line); position: relative; border: 0; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--emerald-2); }
.switch[aria-checked="true"]::after { left: 17px; }
@container (max-width: 560px) { .scope-row { grid-template-columns: 34px minmax(0, 1fr) auto; } .scope-row .chip { grid-column: 2 / -1; justify-self: start; } }
.locked { border: 1px dashed var(--brass); background: var(--brass-tint); }

/* Phone shell (client) */
.phone { display: flex; flex-direction: column; min-height: 760px; background: var(--paper); }
.phone-top { padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border-bottom: 1px solid var(--line); }
.phone-body { padding: 18px; display: flex; flex-direction: column; gap: 16px; flex: 1; }

    catch (e) { this.note = "This browser is not keeping data, so changes last until the page is closed."; }
  },
  async init() {
    let db = null;
    try { db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { this.mode = "local"; this.loadLocal(); scheduleRender(); return; }
    this.db = db; this.mode = "shared";
    let confirmed = false;
    const timer = setTimeout(() => { if (!confirmed) { this.note = "Shared storage can't be reached yet. Records shown may be out of date."; scheduleRender(); } }, 10000);
    COLLECTIONS.forEach(name => {
      db.collection(name).onSnapshot(snap => {
        const next = {};
        snap.docs.forEach(d => { next[d.id] = d.data(); });
        this[name] = next;
        if (!snap.metadata.fromCache && !confirmed) { confirmed = true; clearTimeout(timer); this.note = ""; }
        scheduleRender();
      }, () => { clearTimeout(timer); this.note = "Shared storage has stopped responding. New changes may not be saved."; scheduleRender(); });
    });
  },
  /* Whole-document write, one at a time per document */
  async put(coll, id, body) {
    this[coll] = { ...this[coll], [id]: body };
    if (this.mode !== "shared") { this.persistLocal(); return true; }
    const key = coll + "/" + id;
    const run = () => this.db.doc(key).set(body);
    const p = (this.queue[key] || Promise.resolve()).then(run, run);
    this.queue[key] = p.catch(() => {});
    try { await p; return true; } catch (e) { this.fail(e); return false; }
  },
  fail(e) {
    const code = e && e.code;
    if (code === "invalid_argument") { this.readOnly = true; toast("Your access lets you view these records but not change them."); }
    else if (code === "quota_exceeded") toast("Storage is full, so this could not be saved.");
    else toast("That change could not be saved. Please try again.");
  },
  nextNum() {
    const nums = [...Object.values(this.refs), ...Object.values(this.clients)].map(x => x.num || 0);
    return Math.max(REF_START - 1, ...nums) + 1;
  },
  /* Claim the next free reference. In shared storage a short lease stops two people taking the same number. */
  async claimRef() {
    let n = this.nextNum();
    for (let tries = 0; tries < 25; tries++, n++) {
      const ref = fmtRef(n);
      if (this.refs[ref] || this.clients[ref]) continue;
      const claim = { ref, num: n, claimedAt: new Date().toISOString(), by: ASSESSOR };
      if (this.mode === "shared") {
        const d = this.db.doc("refs/" + ref);
        const lease = await d.acquire({ holder: TAB_ID, ttlMs: 5000 });
        if (!lease.acquired) continue;
        const snap = await d.get();
        if (snap.exists) continue;
        await d.set(claim);
      }
      this.refs = { ...this.refs, [ref]: claim };
      this.persistLocal();
      return claim;
    }
    throw new Error("No free reference");
  }
};

/* ---------- Record accessors: example records and stored records look the same to the screens ---------- */
const isFixture = ref => ref === "EG-001";
function getClient(ref) { return EXAMPLES.find(c => c.ref === ref) || Store.clients[ref] || null; }
const C = () => getClient(S.client) || EXAMPLES[0];
function allClients() { return [...Object.values(Store.clients), ...EXAMPLES].sort((a, b) => b.num - a.num); }
const addrLine = c => [c.address.line1, c.address.line2, c.address.town, c.address.postcode].filter(Boolean).join(", ");
const shortName = c => c.propertyName ? `${c.name.split(" ").slice(-1)[0]}, ${c.propertyName}` : c.name.replace(/^The /, "").split(" ").slice(-1)[0];
function alloc(ref) { const c = getClient(ref); return c && c.example ? S.alloc[ref] : (c && c.tests) || {}; }
async function setAlloc(ref, map) {
  const c = getClient(ref);
  if (c.example) { Object.keys(map).forEach(k => { S.alloc[ref][k] = map[k]; }); markEdited(); render(); return; }
  await Store.put("clients", ref, { ...c, tests: map, updatedAt: new Date().toISOString(), updatedBy: ASSESSOR });
  scheduleRender();
}
function roomsFor(ref) {
  if (isFixture(ref)) return ROOMS;
  const c = getClient(ref);
  if (c.example) return S.exRooms[ref] || DEFAULT_ROOMS;
  return c.rooms && c.rooms.length ? c.rooms : DEFAULT_ROOMS;
}
const byTime = (a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || ""));
function readingsFor(ref) { return (isFixture(ref) ? READINGS : []).concat(Object.values(Store.readings).filter(r => r.client === ref).sort(byTime)); }
function samplesFor(ref) { return (isFixture(ref) ? SAMPLES : []).concat(Object.values(Store.samples).filter(s => s.client === ref).sort(byTime)); }
function testStatus(ref, code) {
  if (!alloc(ref)[code]) return "excluded";
  if (isFixture(ref) && SCOPE[code][0] !== "excluded") return SCOPE[code][0];
  const rs = readingsFor(ref).filter(r => r.point === code);
  if (samplesFor(ref).some(s => s.point === code && s.st === "awaiting")) return "awaiting";
  if (rs.length && rs.every(r => r.result === "observation")) return "inspected";
  if (rs.length) return "measured";
  return "planned";
}
function roomPoints(ref, room) {
  if (isFixture(ref) && room.points) return room.points;
  const rs = readingsFor(ref);
  return Object.fromEntries((ROOM_POINTS[room.type] || []).filter(c => alloc(ref)[c])
    .map(c => [c, rs.some(r => r.room === room.id && r.point === c) ? "measured" : "planned"]));
}
function clientSummary(ref) {
  const a = alloc(ref), codes = ALL_POINTS.filter(c => a[c]);
  const st = codes.map(c => testStatus(ref, c));
  return {
    allocated: codes.length,
    measured: st.filter(s => s === "measured" || s === "inspected").length,
    planned: st.filter(s => s === "planned").length,
    readings: readingsFor(ref).length,
    outstanding: samplesFor(ref).filter(s => s.st === "awaiting").length
  };
}

const GRID_DEF = {

  efpf:{ point: "A1", method: "potential-free", unit: "V/m", inst: null, label: "Electric field, potential-free", ref: "sbm-ef-pf" },
  bv:  { point: "A1", method: "body-voltage", unit: "mV", inst: "bvset", label: "Body voltage", ref: "sbm-bv" },
  mf:  { point: "A2", method: "three-axis", unit: "nT", inst: "me3951", label: "Magnetic field, three axes", ref: "sbm-mf" }
};
function gridReading(qty, pos, phase, roomId) {
  const rs = readingsFor(S.client).filter(r => r.room === roomId && r.grid && r.grid.qty === qty && r.grid.pos === pos && (r.phase || "before") === phase);
  return rs[rs.length - 1] || null;
}
function cellGeneric(qty, i, roomId) {
  const g = GRID_DEF[qty];
  const b = gridReading(qty, i, "before", roomId), a = gridReading(qty, i, "after", roomId);
  const sel = S.cell === i;
  const show = S.phase === "after" ? a : S.phase === "compare" ? (a || b) : b;
  if (!show) return `<button class="cell k-nm" aria-pressed="${sel}" data-action="cell" data-i="${i}"><span class="pos">${GRID_POS[i]}</span><span class="lab">Not measured</span></button>`;
  const dec = v => v == null ? "" : v % 1 ? fmt(v, 1) : fmt(v);
  const k = classify(show.value, g.ref, g.method);
  const line = S.phase === "compare" && a && b
    ? `<span class="compare-v"><span>${dec(b.value)}</span><span class="arrow">→</span><b>${dec(a.value)}</b><small class="muted">${g.unit}</small></span>`
    : `<span class="v">${dec(show.value)}<small> ${g.unit}</small></span>`;
  return `<button class="cell k-${k}" aria-pressed="${sel}" data-action="cell" data-i="${i}"><span class="pos">${GRID_POS[i]}</span>${line}<span class="lab">${EVAL[k].label}${S.phase === "compare" && a ? " after" : ""}</span></button>`;
}

    return `<tr><td>${g.label}</td><td class="num">${b ? fmt(b.value, b.value % 1 ? 1 : 0) + " " + g.unit : "Not measured"}</td><td class="num">${a ? fmt(a.value, a.value % 1 ? 1 : 0) + " " + g.unit : "Not measured"}</td><td>${a ? evalChip(classify(a.value, g.ref, g.method)) : evalChip("nm")}</td></tr>`; }).join("");
  return `${visitTop(`${esc(room.name)} · bed measurements`, "Visit 1 · readings save as you record them")}

    </div>
    ${S.gridQty !== "rf" && S.gridQty !== "efpf" ? `<div class="card card-tight spread"><div class="small">Record a reading at each position, then again after switching off a device or circuit to compare.</div><div class="seg" role="group" aria-label="Condition">${[["before", "Before"], ["after", "After"], ["compare", "Compare"]].map(([k, l]) => `<button aria-pressed="${S.phase === k}" data-action="phase" data-p="${k}">${l}</button>`).join("")}</div></div>` : ""}

      <section class="stack" aria-labelledby="h-grid"><h3 id="h-grid">${S.gridQty === "rf" ? "Radio frequency at the pillow" : GRID_DEF[S.gridQty].label + " · nine-point grid"}</h3>${main}</section>
      <div class="stack-l">
        <section class="card stack" aria-labelledby="h-ba"><h3 id="h-ba">Before and after · ${GRID_POS[S.cell]}</h3>
          <div class="table-wrap"><table><thead><tr><th>Measurement</th><th class="num">Before</th><th class="num">After</th><th>After, SBM</th></tr></thead><tbody>${rows}</tbody></table></div>
          <p class="xsmall muted">Comparable readings share position, equipment and method.</p></section>
        <section class="card stack"><h3>Room plan</h3><p class="small muted">Readings, suspected sources and photographs can be placed on a simple plan of the room. The worked example (EG-001) shows a completed plan.</p></section>
      </div>
    </div>
  </div>`;
}
function rfCoverage() {
  const meters = [inst("hf38"), inst("hfw35")];
  const pos = f => ((Math.log10(f) - 1) / 3) * 100;
  const bands = [["FM", 100, 0], ["TETRA", 400, 1], ["Mobile 800", 800, 0], ["DECT", 1900, 1], ["Wi-Fi 2.4", 2450, 0], ["Wi-Fi 5", 5500, 0], ["Wi-Fi 6E", 6500, 1]];
  return `<div class="stack" style="gap:2px">
      <span class="small"><b>Equipment coverage</b> · ${meters.map(m => `${m.name} (${m.fmin >= 1000 ? m.fmin / 1000 + " GHz" : m.fmin + " MHz"} to ${m.fmax / 1000} GHz)`).join(" and ")}</span>
      <div class="coverage" aria-label="Meters cover about 700 MHz to 6 GHz. Below 700 MHz and above 6 GHz are outside coverage.">
        <div class="track"></div>
        ${meters.map((m, i) => `<div class="cov" style="left:${pos(m.fmin)}%;width:${pos(m.fmax) - pos(m.fmin)}%;opacity:${i ? .65 : .9}"></div>`).join("")}
        ${bands.map(([n, f, row]) => `<span class="tick" style="left:${pos(f)}%"></span><span class="band" style="left:${pos(f)}%;top:${row * 11}px">${n}</span>`).join("")}
        ${[[10, "10 MHz"], [100, "100 MHz"], [1000, "1 GHz"], [10000, "10 GHz"]].map(([f, l]) => `<span class="axislab" style="left:${Math.min(96, Math.max(4, pos(f)))}%">${l}</span>`).join("")}
      </div>
    </div>
    <div class="notice notice-warn">${icon("info")}<span class="small">Below 700 MHz (FM, DAB, TETRA, some TV) and above 6 GHz (Wi-Fi 6E) are outside your meters' range. This caveat carries into the finding and report automatically.</span></div>`;
}
function screenBedroom() { return isFixture(S.client) ? screenBedroomExample() : screenBedroomGeneric(); }

/* ---------- 6. Finding and recommendation editor ---------- */

  const refsFor = { A1: ["sbm-ef", "sbm-bv", "icnirp-ef"], A3: ["sbm-rf"], B6: ["sbm-co2", "bb-co2"], S5: [], S3: [] }[f.point] || [];
  const refCard = id => {
    const r = REF[id]; const k = REF_KIND[r.kind];
    const reading = rs.find(x => x.ref === id) || (id === "icnirp-ef" ? rs[0] : id === "bb-co2" ? rs[0] : null);
    let verdict = "";
    if (r.bands && reading) {
      const c = classify(reading.value, id, reading.method);
      verdict = `<div class="band-scale">${["none", "slight", "strong", "extreme"].map((b, j) => `<div class="${EVAL[b].cls} ${c === b ? "here" : ""}">${EVAL[b].label.replace(" anomaly", "")}<br><span class="mono">${j === 0 ? "<" + r.bands[0] : j === 3 ? "≥" + r.bands[2] : r.bands[j - 1] + " to " + r.bands[j]}</span></div>`).join("")}</div>
        <span class="small">${fmt(reading.value)} ${r.unit} → ${evalChip(c)}</span>`;
    } else if (r.limit && reading) {
      verdict = `<span class="small">Reference ${fmt(r.limit)} ${r.unit}. Measured ${fmt(reading.value)} ${r.unit}: <b>below this reference</b>. This does not mean the sleeping-area guidance is met.</span>`;
    }
    return `<div class="ref-card ${r.kind === "sbm" ? "sbm" : ""}"><span class="chip ${k.cls}" style="align-self:flex-start">${k.label}</span><b class="small">${r.quantity}</b><span class="xsmall muted">${r.source} · Edition ${r.edition} · Unit ${r.unit}</span><span class="xsmall">${r.conditions}</span>${verdict}</div>`;
  };
  return assessorShell("finding", `

    <div class="editor">
      <nav class="finding-list stack" style="gap:4px" aria-label="Findings">
        ${FINDINGS.map(x => `<button class="finding-item" data-action="finding" data-id="${x.id}" aria-current="${x.id === f.id}"><span class="xsmall muted">${x.room} · ${x.point}</span><b class="small">${x.title}</b><span class="row" style="gap:6px"><span class="chip ${x.status === "approved" ? "c-ok" : "c-muted"}">${x.status === "approved" ? "Approved" : "Draft"}</span><span class="xsmall muted">${x.by} · ${x.edited}</span></span></button>`).join("")}
        <button class="btn btn-s" style="margin-top:6px" data-action="toast" data-msg="New finding created from selected readings">${icon("plus")}New finding</button>
      </nav>
      <div class="card stack-l">
        <div class="spread"><div><span class="eyebrow">${f.room} · ${f.point} ${POINT_NAME[f.point]}</span><h2>${f.title}</h2></div><span class="chip ${f.status === "approved" ? "c-ok" : "c-muted"}">${f.status === "approved" ? "Approved" : "Draft"}</span></div>
        <div class="stack"><h4>Linked evidence</h4>
          ${rs.length ? `<div class="table-wrap"><table><thead><tr><th>Reading</th><th class="num">Value</th><th>Type</th><th>Evaluation</th></tr></thead><tbody>${rs.map(r => `<tr><td><span class="mono xsmall">${r.id}</span> ${r.label}${r.phase === "after" ? " <span class='tag'>After</span>" : ""}</td><td class="num mono">${r.value ?? ""} ${r.unit}</td><td class="small">${RESULT[r.result]}</td><td>${evalChip(readingEval(r))}</td></tr>`).join("")}</tbody></table></div>` : `<p class="small muted">No readings linked. A written professional assessment is required.</p>`}
          <div class="row"><span class="chip c-muted">${icon("photo")}2 photographs</span><span class="chip c-muted">${icon("grid")}Bed grid</span><span class="chip c-muted">${icon("doc")}Room plan</span></div>

        <div class="field"><label for="fe-what">What you can do</label><textarea id="fe-what" class="input" rows="5" data-input="edit">${esc(f.what)}</textarea></div>

      <aside class="stack" aria-labelledby="h-ref">

        ${main && main.inst === "hf38" ? `<div class="notice notice-warn">${icon("info")}<span class="small">Combined coverage of the HF38B-W and HFW35C is about 700 MHz to 6 GHz. Sources outside that range, including Wi-Fi 6E, are not captured. Caveat included in the report text.</span></div>` : ""}

const METHODS = [["any", "Standard method for this test"], ["earthed", "Earthed method (electric field)"], ["potential-free", "Potential-free (electric field)"], ["body-voltage", "Body voltage against earth"], ["three-axis", "Three orientations, resultant calculated"], ["peak", "Peak, max hold (RF)"], ["rms", "Average, RMS (RF)"]];
const SAMPLE_TYPES = { W: ["Water", "S1", "tespert"], A: ["Air", "B1", "lab"], D: ["Settled dust", "C1", "dust"], M: ["Mould swab", "C1", "swab"], R: ["Radon detector", "A6", "radon"], X: ["Other material", "S4", "lab"] };
const SAMPLE_STATUS = [["Collected", "awaiting"], ["At laboratory", "awaiting"], ["Deployed", "awaiting"], ["Screened on site", "measured"], ["Result received", "measured"]];
/* Reference entry chosen from the test, unit and method, so classification only appears where it applies */
function refFor(point, unit, method) {
  if (point === "A1" && unit === "V/m") return method === "earthed" ? "sbm-ef" : method === "potential-free" ? "sbm-ef-pf" : null;
  if (point === "A1" && unit === "mV" && method === "body-voltage") return "sbm-bv";
  if (point === "A2" && unit === "nT" && method === "three-axis") return "sbm-mf";
  if (point === "A3" && unit === "µW/m²" && method === "peak") return "sbm-rf";
  if (point === "B6" && unit === "ppm") return "sbm-co2";
  return null;
}

function csvPreview(text, name) {
  const rows = text.trim().split(/\r?\n/).map(l => l.split(","));
  const head = rows[0] || [], data = rows.slice(1);
  const numCol = head.findIndex((h, i) => i > 0 && data.every(r => !isNaN(parseFloat(r[i]))));
  const vals = numCol > 0 ? data.map(r => parseFloat(r[numCol])) : [];
  const max = vals.length ? Math.max(...vals) : 0, min = vals.length ? Math.min(...vals) : 0;
  const w = 600, h = 120, pad = 24;
  const pts = vals.map((v, i) => [pad + (i / Math.max(1, vals.length - 1)) * (w - pad * 2), h - pad - ((v - min) / Math.max(1, max - min)) * (h - pad * 2)]);
  return `<div class="stack">
    <div class="spread small"><b>${esc(name)}</b><span class="muted">${data.length} rows · ${head.length} columns</span></div>
    <div class="grid-3">${head.map((c, i) => `<div class="field"><label for="map-${i}">${esc(c)}</label><select id="map-${i}" class="input">${["Timestamp", "CO₂ (ppm)", "Temperature (°C)", "Relative humidity (%)", "Pressure (hPa)", "Ignore"].map((o, j) => `<option ${j === Math.min(i, 4) ? "selected" : ""}>${o}</option>`).join("")}</select></div>`).join("")}</div>
    ${vals.length > 1 ? `<div class="table-wrap" style="padding:8px"><svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto" role="img" aria-label="Preview of ${esc(head[numCol])}, ${fmt(min)} to ${fmt(max)}">
      <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="var(--line)"/>
      <polyline fill="none" stroke="var(--emerald-2)" stroke-width="2" points="${pts.map(p => p.join(",")).join(" ")}"/>
      ${pts.length ? `<circle cx="${pts[vals.indexOf(max)][0]}" cy="${pts[vals.indexOf(max)][1]}" r="4" fill="var(--emerald)"/><text x="${pts[vals.indexOf(max)][0]}" y="${pts[vals.indexOf(max)][1] - 8}" font-size="11" text-anchor="middle" fill="var(--ink)">Max ${fmt(max)}</text>` : ""}
      <text x="${pad}" y="${h - 6}" font-size="10" fill="var(--ink-3)">${esc(data[0][0])}</text><text x="${w - pad}" y="${h - 6}" font-size="10" fill="var(--ink-3)" text-anchor="end">${esc(data[data.length - 1][0])}</text>
    </svg></div>` : ""}

}

  modal: d => openModal(d.modal, {}),
  close: () => closeModal(),
  backdrop: (d, el, e) => { if (e.target === el) closeModal(); },
  async importcsv() {
    const c = C(), room = currentRoom();
    if (isFixture(c.ref)) { closeModal(); markEdited(); toast("Overnight data imported: 10 points, maximum 1,450 ppm at 05:00"); return; }
    const text = (S.csv && S.csv.text) || SAMPLE_CSV, rows = text.trim().split(/\r?\n/).slice(1).map(l => l.split(","));
    const vals = rows.map(r => parseFloat(r[1])).filter(v => !isNaN(v));
    if (!vals.length) { toast("No readings found in that file"); return; }
    const max = Math.max(...vals), id = `${c.ref}-R${Date.now().toString(36)}`;
    const ok = await Store.put("readings", id, { id, client: c.ref, room: room.id, point: "B6", label: "CO₂ overnight maximum, imported from CSV", value: max, axes: null, unit: "ppm", ref: "sbm-co2", method: "any", methodLabel: `Logger CSV import, ${vals.length} points`, inst: "aranet4", timing: "overnight", result: "reading", when: nowStamp(), dur: `${vals.length} readings`, loc: (S.csv && S.csv.name) || "Aranet4 export", cond: {}, by: ASSESSOR, phase: null, grid: null, note: "", createdAt: new Date().toISOString() });
    closeModal(); toast(ok ? `Imported to ${c.ref}: ${vals.length} points, maximum ${fmt(max)} ppm` : "The import could not be saved.");
  },
  qty: d => { S.gridQty = d.q; S.cell = d.q === "bv" ? 0 : S.cell; render(); },
  phase: d => { S.phase = d.p; render(); },
  cell: d => { S.cell = +d.i; render(); },
  pin: d => { S.planPin = d.pin; render(); },
  finding: d => { S.findingId = d.id; S.priority = null; S.explanationOpen = false; render(); },
  conflict: d => { S.conflict = false; if (d.keep === "theirs") FINDINGS[0].cost = "Free to £400"; markEdited(); render(); toast(d.keep === "theirs" ? "Alfie's cost range applied. Both versions kept in history." : "Your version kept. Alfie has been notified."); },
  explain: () => { S.explanationOpen = !S.explanationOpen; render(); },
  useexplain: d => { const f = findingById(S.findingId); f.why = EXPLANATIONS.find(x => x.id === d.id).text; S.explanationOpen = false; markEdited(); render(); },
  prio: d => { S.priority = d.p; findingById(S.findingId).priority = d.p; markEdited(); render(); },
  approve: () => { const f = findingById(S.findingId); f.status = "approved"; f.edited = "Just now"; markEdited(); render(); toast("Finding approved"); },
  check: d => { S.checks[d.k] = !S.checks[d.k]; render(); },
  publish: () => { S.versions.push({ v: "v1.1", label: "Full report", date: "23 Oct 2026", by: "Iza", note: "Published to portal. Reference set SBM-2024 / UK 2026.1 frozen with this version." }); render(); toast("Report v1.1 published. Harriet and Tom have been notified."); },
  qnext: () => { S.qStep = Math.min(7, S.qStep + 1); render(); },
  qprev: () => { S.qStep = Math.max(0, S.qStep - 1); render(); },
  qgo: d => { S.qStep = +d.step; render(); },
  qroom: d => { S.qRooms[d.v] = !S.qRooms[d.v]; render(); },
  qconcern: d => { S.qConcerns[d.v] = !S.qConcerns[d.v]; render(); },
  qconsent: () => { S.qConsent = !S.qConsent; render(); },
  qsend: () => { S.qSent = true; render(); },
  qreset: () => { S.qSent = false; S.qStep = 7; render(); },
  eq: d => { S.eq = d.id; render(); },
  ptab: d => { S.portalTab = d.t; render(); },
  done: d => { S.done[d.id] = !S.done[d.id]; render(); if (S.done[d.id]) toast("Marked as done. Iza and Alfie can see your progress."); }
};
function saveNote(ref, roomId, text) {
  const c = getClient(ref); markEdited();
  if (c.example) { S.notes[ref + ":" + roomId] = text; return; }
  debounce("note:" + ref + roomId, () => updateClient(ref, { notes: { ...(getClient(ref).notes || {}), [roomId]: text } }));
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  if (el.tagName === "A") e.preventDefault();
  const fn = ACT[el.dataset.action];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("g[data-action], tr[data-action], div[data-action][tabindex]")) { e.preventDefault(); ACT[e.target.dataset.action](e.target.dataset, e.target, e); }
  if (e.key === "Escape" && S.modal) closeModal();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.getAttribute("aria-invalid") === "true") { t.removeAttribute("aria-invalid"); const er = document.getElementById(t.id + "-err"); if (er) er.hidden = true; }
  if (t.matches("[data-input]")) markEdited();
  if (t.matches("[data-search-input]")) { S.search = t.value; applySearch(); }
  if (t.matches("[data-note]")) saveNote(S.client, t.dataset.note, t.value);
  if (t.matches("[data-intnote]")) {
    const ref = t.dataset.intnote, c = getClient(ref); markEdited();
    if (c.example) S.notes["int-" + ref] = t.value; else debounce("int:" + ref, () => updateClient(ref, { internalNote: t.value }));
  }
  if (t.matches("[data-dupcheck]")) {
    const name = t.value.trim().toLowerCase(), editing = S.modalCtx && S.modalCtx.edit;
    const same = name ? allClients().filter(c => c.name.toLowerCase() === name && !(editing && c.ref === S.client)) : [];
    document.getElementById("m-dup").innerHTML = same.length ? `<div class="notice notice-info">${icon("info")}<span class="small">${same.map(c => `${c.ref} · ${esc(c.name)} · ${esc(addrLine(c))}`).join("<br>")}<br>A client with this name already exists. If this is a second home, add a property name so the two records are easy to tell apart.</span></div>` : "";
  }
});
document.addEventListener("change", e => {
  const t = e.target, kind = t.dataset.change;
  if (t.id === "m-meth") { const axes = t.value === "three-axis"; document.getElementById("m-axes").hidden = !axes; document.getElementById("m-valwrap").hidden = axes; }
  if (t.id === "m-inst") { const eq = inst(t.value); if (eq) document.getElementById("m-result").value = eq.result; }
  if (t.id === "s-type") {
    document.getElementById("s-water").hidden = t.value !== "W";
    document.getElementById("s-lab").value = t.value === "W" ? "On-site screening" : t.value === "R" ? "Analysis on return" : "External specialist laboratory";
  }
  if (kind === "qfile" && t.files.length) { S.qFiles.push(...[...t.files].map(f => f.name)); render(); }
  if (kind === "roomphoto" && t.files.length) { markEdited(); toast(`Photograph attached to ${currentRoom().name}${S.online ? "" : ", queued for upload"}`); }
  if (kind === "progress" && t.files[0]) { const id = t.dataset.id; const rd = new FileReader(); rd.onload = () => { S.photos[id] = rd.result; render(); toast("Progress photo shared with Iza and Alfie"); }; rd.readAsDataURL(t.files[0]); }
  if (kind === "csv" && t.files[0]) { const f = t.files[0]; const rd = new FileReader(); rd.onload = () => { const text = String(rd.result).slice(0, 200000); S.csv = { text, name: f.name }; document.getElementById("csv-preview").innerHTML = csvPreview(text, f.name); }; rd.readAsText(f); }
});
document.addEventListener("submit", e => {
  if (e.target.matches("[data-form='ask']")) {
    e.preventDefault();
    const t = document.getElementById("ask-text");
    if (!t.value.trim()) { toast("Please write your question first"); return; }
    S.messages.push({ me: true, text: t.value.trim(), when: "Just now" }); render(); toast("Question sent. We usually reply within one working day.");
  }
});

(function start() {
  document.getElementById("brand").innerHTML = logoInner("Assessment Studio");
  const h = (location.hash || "").replace("#", "");
  const k = LEGACY[h] || h;
  if (RENDER[k]) S.screen = k;
  render();
  window.addEventListener("hashchange", () => { const n = location.hash.replace("#", ""); const m = LEGACY[n] || n; if (RENDER[m] && m !== S.screen) go(m); });
  Store.init();
})();
</script>
</body>
